ACTIONS["toggle-recipe-form"] = () => setUI("recettes", { showForm: !ui("recettes").showForm, error: "" });
ACTIONS["cancel-recipe-form"] = () => setUI("recettes", { showForm: false, error: "" });
ACTIONS["recipe-item-add"] = () => {
  const v = ui("recettes");
  if (!v.items) v.items = [{ materialId: state.db.rawMaterials[0] ? state.db.rawMaterials[0].id : "", qty: "" }];
  v.items.push({ materialId: state.db.rawMaterials[0] ? state.db.rawMaterials[0].id : "", qty: "" });
  render();
};
ACTIONS["recipe-item-remove"] = (el) => {
  const v = ui("recettes");
  v.items.splice(Number(el.dataset.index), 1);
  render();
};
ACTIONS["recipe-item-material"] = (el) => {
  const v = ui("recettes");
  if (!v.items) v.items = [];
  const i = Number(el.dataset.index);
  if (v.items[i]) v.items[i].materialId = el.value;
  render();
};
ACTIONS["save-recipe"] = () => {
  const v = ui("recettes");
  const f = v.form || { name: "", texture: "Solide", netWeight: "", yieldPct: 100, fragrance: "" };
  const items = v.items || [];
  const name = (f.name || "").trim();
  if (!name) { v.error = "Le nom du produit/recette est obligatoire."; render(); return; }
  if (state.db.recipes.some((r) => r.name.trim().toLowerCase() === name.toLowerCase())) { v.error = "Une recette porte déjà ce nom."; render(); return; }
  if (!isPositiveNumber(f.netWeight)) { v.error = "Le poids net doit être un nombre supérieur à 0."; render(); return; }
  const yp = Number(f.yieldPct);
  if (!Number.isFinite(yp) || yp <= 0 || yp > 100) { v.error = "Le rendement doit être compris entre 1 et 100 %."; render(); return; }
  const validItems = items.filter((it) => it.materialId && isPositiveNumber(it.qty));
  if (validItems.length === 0) { v.error = "Ajoutez au moins un ingrédient avec une quantité supérieure à 0."; render(); return; }
  v.error = "";
  setDb((prev) => ({
    ...prev,
    recipes: [...prev.recipes, {
      id: uid(), name, textureType: f.texture || "Solide", netWeight: Number(f.netWeight), netWeightUnit: "g", fragrance: (f.fragrance || "").trim(),
      yieldPct: yp, packagingCost: 0, laborMinutes: 0,
      items: validItems.map((it) => ({ materialId: it.materialId, qty: Number(it.qty) })),
    }],
  }));
  v.showForm = false; v.form = null; v.items = null;
  render();
};

/* ============================================================ */
/* Tarification                                                    */
/* ============================================================ */
function renderTarification(db) {
  const v = ui("tarification");
  if (db.recipes.length === 0) return card("Calculateur de prix de vente", `<p class="ma-muted">Créez d'abord une recette dans l'onglet Recettes.</p>`, { icon: "percent" });

  const recipeId = v.recipeId || db.recipes[0].id;
  const recipe = db.recipes.find((r) => r.id === recipeId);
  const marginPct = v.marginPct !== undefined ? Number(v.marginPct) : 65;
  const product = recipe && db.products.find((p) => p.recipeId === recipe.id);
  const hourlyRate = db.workshop.hourlyRate ?? 15;
  const materialsCost = recipe ? recipeUnitCost(recipe, db.rawMaterials) : 0;
  const packagingCost = (recipe && recipe.packagingCost) || 0;
  const laborMinutes = (recipe && recipe.laborMinutes) || 0;
  const laborCost = (laborMinutes / 60) * hourlyRate;
  const totalCost = materialsCost + packagingCost + laborCost;
  const safeMargin = Math.min(90, Math.max(0, marginPct));
  const suggestedPrice = Math.round((totalCost / (1 - safeMargin / 100)) * 10) / 10;
  const currentPrice = product ? product.pricePublic : 0;
  const currentMarginPct = currentPrice > 0 ? ((currentPrice - totalCost) / currentPrice) * 100 : null;

  const overviewRows = db.products.map((p) => {
    const r = db.recipes.find((rr) => rr.id === p.recipeId);
    const mCost = r ? recipeUnitCost(r, db.rawMaterials) : 0;
    const other = ((r && r.packagingCost) || 0) + (((r && r.laborMinutes) || 0) / 60) * hourlyRate;
    const total = mCost + other;
    const marge = p.pricePublic - total;
    const margePct = p.pricePublic > 0 ? (marge / p.pricePublic) * 100 : 0;
    return `<tr>
      <td><button class="ma-link-inline" data-action="tarif-select-recipe" data-id="${r ? r.id : ""}" style="color:${r && r.id === recipeId ? "var(--teal)" : "var(--ink)"}">${esc(p.name)}</button></td>
      <td class="ma-muted">${fmtEUR(mCost)}</td>
      <td class="ma-muted">${fmtEUR(other)}</td>
      <td>${fmtEUR(total)}</td>
      <td class="ma-strong">${fmtEUR(p.pricePublic)}</td>
      <td style="color:${marge >= 0 ? "var(--sage)" : "var(--brick)"}">${fmtNum(margePct, 0)}%</td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" style="text-align:center;padding:16px" class="ma-muted">Aucun produit référencé pour le moment.</td></tr>`;

  return `<div class="ma-stack">
    ${card("Calculateur de prix de vente", `
      <div class="ma-grid ma-grid-2" style="margin-bottom:14px">
        ${field("Recette / produit", `<select data-bind="tarification.recipeId">${db.recipes.map((r) => `<option value="${r.id}" ${recipeId === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>`)}
        ${field("Taux horaire atelier (€/h)", `<input type="number" min="0" step="0.5" value="${hourlyRate}" data-db-input="hourly-rate" data-key="hourly-rate" />`)}
      </div>
      ${!product ? `<p class="ma-sm" style="color:var(--brick);margin-bottom:12px">Aucun produit catalogué n'utilise encore cette recette — le prix suggéré ne pourra être appliqué qu'une fois un premier lot produit (onglet Production).</p>` : ""}
      <div class="ma-grid ma-grid-2">
        <div>
          ${field("Coût matières (calculé — fret & octroi de mer inclus)", `<div class="ma-readonly">${fmtEUR(materialsCost)}</div>`)}
          <div style="margin-top:10px">${field("Emballage / étiquette (€ par unité)", `<input type="number" min="0" step="0.05" value="${packagingCost}" data-db-input="recipe-packaging" data-key="pkg-${recipeId}" />`)}</div>
          <div style="margin-top:10px">${field("Temps de fabrication (minutes par unité)", `<input type="number" min="0" step="1" value="${laborMinutes}" data-db-input="recipe-labor" data-key="labor-${recipeId}" />`)}</div>
          <div class="ma-cost-line"><span class="ma-muted">Main d'œuvre (${fmtNum(laborMinutes, 0)} min × ${fmtEUR(hourlyRate)}/h)</span><span class="ma-strong">${fmtEUR(laborCost)}</span></div>
          <div class="ma-cost-line ma-cost-total"><span>Coût de revient total</span><span>${fmtEUR(totalCost)}</span></div>
        </div>
        <div class="ma-tarif-panel">
          ${field(`Marge cible sur prix de vente : ${safeMargin}%`, `<input type="range" min="0" max="90" value="${marginPct}" data-bind="tarification.marginPct" style="width:100%" />`)}
          <p class="ma-sm ma-muted" style="margin-bottom:10px">Prix = coût de revient ÷ (1 − marge). Une marge de 65% correspond à un coefficient ×2,9 environ.</p>
          <div class="ma-tarif-suggested">
            <p class="ma-sm ma-muted" style="margin:0">Prix de vente suggéré</p>
            <p class="ma-tarif-price">${fmtEUR(suggestedPrice)}</p>
            <p class="ma-sm ma-muted" style="margin:2px 0 0">Marge : ${fmtEUR(suggestedPrice - totalCost)} (${fmtNum(safeMargin, 0)}%)</p>
          </div>
          ${product ? `<div class="ma-cost-line" style="border:none;padding-top:10px"><span class="ma-muted">Prix actuel du produit</span><span class="ma-strong">${fmtEUR(currentPrice)} ${currentMarginPct != null ? `<span class="ma-muted">(${fmtNum(currentMarginPct, 0)}% marge)</span>` : ""}</span></div>` : ""}
          <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
            ${btn("Appliquer ce prix au produit", "apply-tarif-price", { icon: "check", disabled: !product })}
            ${v.applied ? `<span class="ma-sm" style="color:var(--sage);display:flex;align-items:center;gap:4px">${icon("check", 13)}Prix mis à jour</span>` : ""}
          </div>
        </div>
      </div>
    `, { icon: "percent" })}
    ${card("Vue d'ensemble — tous les produits", `<div class="ma-table-wrap"><table>
      <thead><tr><th>Produit</th><th>Coût matières</th><th>Emballage + MO</th><th>Coût total</th><th>Prix actuel</th><th>Marge actuelle</th></tr></thead>
      <tbody>${overviewRows}</tbody>
    </table></div>`, { icon: "bar-chart" })}
  </div>`;
}
ACTIONS["tarif-select-recipe"] = (el) => { if (el.dataset.id) setUI("tarification", { recipeId: el.dataset.id }); };
ACTIONS["apply-tarif-price"] = () => {
  const v = ui("tarification");
  const db = state.db;
  const recipeId = v.recipeId || db.recipes[0].id;
  const recipe = db.recipes.find((r) => r.id === recipeId);
  const product = recipe && db.products.find((p) => p.recipeId === recipe.id);
  if (!product) return;
  const hourlyRate = db.workshop.hourlyRate ?? 15;
  const materialsCost = recipeUnitCost(recipe, db.rawMaterials);
  const totalCost = materialsCost + ((recipe.packagingCost) || 0) + (((recipe.laborMinutes) || 0) / 60) * hourlyRate;
  const marginPct = v.marginPct !== undefined ? Number(v.marginPct) : 65;
  const safeMargin = Math.min(90, Math.max(0, marginPct));
  const suggestedPrice = Math.round((totalCost / (1 - safeMargin / 100)) * 10) / 10;
  setDb((prev) => ({ ...prev, products: prev.products.map((p) => (p.id === product.id ? { ...p, pricePublic: suggestedPrice } : p)) }));
  v.applied = true; render();
  setTimeout(() => { v.applied = false; render(); }, 2000);
};
INPUT_ACTIONS["hourly-rate"] = (el) => setDbSilent((prev) => ({ ...prev, workshop: { ...prev.workshop, hourlyRate: clampNonNegative(el.value, prev.workshop.hourlyRate ?? 15) } }));
INPUT_ACTIONS["recipe-packaging"] = (el) => {
  const recipeId = ui("tarification").recipeId || state.db.recipes[0].id;
  setDbSilent((prev) => ({ ...prev, recipes: prev.recipes.map((r) => (r.id === recipeId ? { ...r, packagingCost: clampNonNegative(el.value, 0) } : r)) }));
};
INPUT_ACTIONS["recipe-labor"] = (el) => {
  const recipeId = ui("tarification").recipeId || state.db.recipes[0].id;
  setDbSilent((prev) => ({ ...prev, recipes: prev.recipes.map((r) => (r.id === recipeId ? { ...r, laborMinutes: clampNonNegative(el.value, 0) } : r)) }));
};


/* ============================================================ */
/* Démarrage de l'application                                     */
/* ============================================================ */
async function boot() {
  initEvents();

  // 1) Tentative Google Drive (si configuré et hors claude.ai — non applicable ici)
  if (driveConfigured()) {
    let tries = 0;
    const check = () => {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        window.__driveTokenClient = window.google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {} });
        state.driveStatus = "disconnected";
        const cached = loadCachedDriveToken();
        if (cached) driveSyncFlow(cached.token, { silent: true });
      } else if (tries < 25) { tries++; setTimeout(check, 300); }
    };
    check();
  }

  // 2) Chargement des données (localStorage — pas de compte hors claude.ai)
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state.db = raw ? withDefaults(JSON.parse(raw)) : seedData();
  } catch (e) {
    state.db = seedData();
  }

  // 3) Lien QR (?lot=...) — ouvre directement la traçabilité du lot
  try {
    const params = new URLSearchParams(window.location.search);
    const lot = params.get("lot");
    if (lot) { state.initialLot = lot; state.tab = "tracabilite"; }
  } catch (e) {}

  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
