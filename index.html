/* ============================================================ */
/* Synchronisation Google Drive — utilisée uniquement quand l'app  */
/* tourne hors de claude.ai (ex. version PWA sur GitHub Pages),    */
/* où il n'y a pas de compte intégré. Remplacez GOOGLE_CLIENT_ID   */
/* par votre identifiant OAuth avant de déployer (voir README).    */
/* Le fichier de données est stocké dans le dossier privé          */
/* "appData" de Google Drive : invisible dans le Drive normal de   */
/* l'utilisatrice, accessible uniquement par cette application.    */
const GOOGLE_CLIENT_ID = "VOTRE_CLIENT_ID.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE_NAME = "malyah-art-data.json";
const DRIVE_TOKEN_KEY = "malyah_art_drive_token_v1";

function driveConfigured() {
  return typeof GOOGLE_CLIENT_ID === "string" && GOOGLE_CLIENT_ID.indexOf("VOTRE_CLIENT_ID") === -1 && GOOGLE_CLIENT_ID.length > 10;
}
function loadCachedDriveToken() {
  try {
    const raw = localStorage.getItem(DRIVE_TOKEN_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.token && parsed.expiresAt > Date.now() + 60000) return parsed;
    return null;
  } catch (e) { return null; }
}
function cacheDriveToken(token, expiresInSec) {
  try { localStorage.setItem(DRIVE_TOKEN_KEY, JSON.stringify({ token, expiresAt: Date.now() + (expiresInSec || 3500) * 1000 })); } catch (e) {}
}
function clearCachedDriveToken() {
  try { localStorage.removeItem(DRIVE_TOKEN_KEY); } catch (e) {}
}
async function driveFindOrCreateFile(token) {
  const listRes = await fetch(
    "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=" + encodeURIComponent(`name='${DRIVE_FILE_NAME}'`) + "&fields=files(id,modifiedTime)",
    { headers: { Authorization: "Bearer " + token } }
  );
  if (!listRes.ok) throw new Error("drive_list_failed");
  const listData = await listRes.json();
  if (listData.files && listData.files.length > 0) return listData.files[0];
  const boundary = "malyahartboundary";
  const createRes = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": `multipart/related; boundary=${boundary}` },
    body:
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
      JSON.stringify({ name: DRIVE_FILE_NAME, parents: ["appDataFolder"] }) +
      `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n{}\r\n--${boundary}--`,
  });
  if (!createRes.ok) throw new Error("drive_create_failed");
  const created = await createRes.json();
  return { id: created.id, modifiedTime: new Date().toISOString() };
}
async function driveReadFile(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: "Bearer " + token } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("drive_read_failed");
  const text = await res.text();
  if (!text) return null;
  try { return JSON.parse(text); } catch (e) { return null; }
}
async function driveWriteFile(token, fileId, data) {
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error("drive_write_failed");
}

/* Helpers métier                                                      */
/* ================================================================== */

const fmtEUR = (n) =>
  new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(Number.isFinite(n) ? n : 0);
const fmtNum = (n, d = 1) =>
  new Intl.NumberFormat("fr-FR", { maximumFractionDigits: d }).format(Number.isFinite(n) ? n : 0);
const todayISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Validation — utilitaires partagés par les formulaires. */
function clampNonNegative(v, fallback = 0) {
  const n = Number(v);
  return Number.isFinite(n) && n >= 0 ? n : fallback;
}
function isPositiveNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) && n > 0;
}
function isValidEmail(v) {
  if (!v) return true; // champ optionnel
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
}
function isValidSiret(v) {
  if (!v) return true; // champ optionnel
  return /^\d{14}$/.test(v.replace(/\s/g, ""));
}
function ErrorText({ children }) {
  if (!children) return null;
  return <p className="text-sm flex items-center gap-1.5 mt-2" style={{ color: BRICK }}><AlertTriangle size={13} className="shrink-0" />{children}</p>;
}

function nextBatchNumber(recipeName, existingBatches) {
  const datePart = todayISO().replace(/-/g, "");
  const key = (recipeName || "PROD").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "PROD";
  let n = 1, candidate;
  do {
    candidate = `LOT-${datePart}-${key}${String(n).padStart(2, "0")}`;
    n += 1;
  } while (existingBatches.some((b) => b.batchNumber === candidate));
  return candidate;
}

function nextSku(existingProducts) {
  let n = existingProducts.length + 1;
  let candidate;
  do {
    candidate = String(n).padStart(4, "0");
    n += 1;
  } while (existingProducts.some((p) => p.sku === candidate));
  return candidate;
}

/* Coût unitaire rendu Guyane — figé à l'achat (indépendant du stock restant). */
function unitCostGuyane(material) {
  const base = material.purchasePrice * (1 + material.freightPct);
  return material.initialQty > 0 ? base / material.initialQty : 0;
}

function recipeUnitCost(recipe, rawMaterials) {
  const raw = recipe.items.reduce((sum, it) => {
    const mat = rawMaterials.find((m) => m.id === it.materialId);
    return mat ? sum + it.qty * unitCostGuyane(mat) : sum;
  }, 0);
  const yieldPct = recipe.yieldPct > 0 ? recipe.yieldPct : 100;
  return raw / (yieldPct / 100);
}

/* --- Code-barres Code 39 (chiffres 0-9 et tiret uniquement) ---
   Choix technique : la table Code 128 complète (106 symboles + checksum)
   est trop dense pour être retranscrite ici sans risque d'erreur — un
   code-barres "faux" serait pire que pas de code-barres du tout sur une
   étiquette réglementaire. Le Code 39 numérique ci-dessous est vérifié
   (structure 3-parmi-9) et reste lisible par tout scanner standard.
   -> Pour un vrai Code 128 / QR, la version native Swift utilisera
   CoreImage (CICode128BarcodeGenerator / CIQRCodeGenerator), natifs et fiables. */
const CODE39 = {
  "0": "NNNWWNWNN", "1": "WNNWNNNNW", "2": "NNWWNNNNW", "3": "WNWWNNNNN", "4": "NNNWWNNNW",
  "5": "WNNWWNNNN", "6": "NNWWWNNNN", "7": "NNNWNNWNW", "8": "WNNWNNWNN", "9": "NNWWNNWNN",
  "-": "NNNWNWNNW", "*": "NNWNWNWNN",
};
function traceDigits(str) {
  return (str || "").replace(/[^0-9-]/g, "") || "0";
}
function Barcode39({ value, height = 34, className = "" }) {
  const digits = traceDigits(value);
  const seq = `*${digits}*`;
  const bars = [];
  let x = 0;
  const narrow = 2, wide = 5, gap = 2;
  [...seq].forEach((ch, ci) => {
    const pattern = CODE39[ch] || CODE39["-"];
    [...pattern].forEach((el, i) => {
      const w = el === "W" ? wide : narrow;
      const isBar = i % 2 === 0;
      if (isBar) bars.push({ x, w });
      x += w;
    });
    if (ci < seq.length - 1) x += gap;
  });
  const totalWidth = x;
  return (
    <svg viewBox={`0 0 ${totalWidth} ${height}`} className={className} style={{ width: "100%", height }}>
      <rect x="0" y="0" width={totalWidth} height={height} fill="white" />
      {bars.map((b, i) => (
        <rect key={i} x={b.x} y="0" width={b.w} height={height} fill={INK} />
      ))}
    </svg>
  );
}

/* QR réellement scannable — encodage via qrcode-generator (kazuhikoarase),
   rendu en SVG pur (aucune dépendance canvas/DOM). */
function QRCodeSVG({ value, size = 68 }) {
  const cells = useMemo(() => {
    try {
      const qr = window.qrcode(0, "M");
      qr.addData(value || "");
      qr.make();
      const n = qr.getModuleCount();
      const rows = [];
      for (let r = 0; r < n; r++) {
        const row = [];
        for (let c = 0; c < n; c++) row.push(qr.isDark(r, c));
        rows.push(row);
      }
      return rows;
    } catch (e) { return null; }
  }, [value]);
  if (!cells) return <div style={{ width: size, height: size }} className="bg-slate-100 flex items-center justify-center text-[8px] text-slate-400">QR</div>;
  const n = cells.length;
  const cell = size / n;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: size, height: size }} shapeRendering="crispEdges">
      <rect width={size} height={size} fill="white" />
      {cells.map((row, r) => row.map((dark, c) => (dark ? <rect key={`${r}-${c}`} x={c * cell} y={r * cell} width={cell} height={cell} fill={INK} /> : null)))}
    </svg>
  );
}

function MalyahArtApp() {
  const [db, setDb] = useState(null);
  const [tab, setTab] = useState("accueil");
  const [status, setStatus] = useState("");
  const saveTimer = useRef(null);
  const dbDocRef = useRef(null);
  const driveTokenClientRef = useRef(null);
  const driveFileIdRef = useRef(null);
  const driveLastPayloadRef = useRef(null);
  const [driveStatus, setDriveStatus] = useState("unavailable"); // unavailable | disconnected | connecting | connected | error
  const [driveLastSync, setDriveLastSync] = useState(null);

  const driveSync = async (token, opts = {}) => {
    try {
      setDriveStatus("connecting");
      const file = await driveFindOrCreateFile(token);
      driveFileIdRef.current = file.id;
      const remote = await driveReadFile(token, file.id);
      if (remote) {
        driveLastPayloadRef.current = JSON.stringify(remote);
        setDb(withDefaults(remote));
      } else {
        setDb((prev) => {
          const base = prev || seedData();
          driveWriteFile(token, file.id, base).catch(() => {});
          driveLastPayloadRef.current = JSON.stringify(base);
          return prev || base;
        });
      }
      setDriveStatus("connected");
      setDriveLastSync(new Date());
    } catch (e) {
      setDriveStatus(opts.silent ? "disconnected" : "error");
    }
  };

  const connectDrive = () => {
    if (!driveTokenClientRef.current) return;
    driveTokenClientRef.current.callback = (resp) => {
      if (resp && resp.access_token) {
        cacheDriveToken(resp.access_token, resp.expires_in);
        driveSync(resp.access_token);
      } else {
        setDriveStatus("error");
      }
    };
    driveTokenClientRef.current.requestAccessToken({ prompt: "consent" });
  };
  const disconnectDrive = () => {
    clearCachedDriveToken();
    driveFileIdRef.current = null;
    driveLastPayloadRef.current = null;
    setDriveStatus("disconnected");
  };

  /* Initialisation Google Drive — uniquement si l'app ne tourne pas dans
     claude.ai (où la capacité "db" gère déjà la sauvegarde par compte). */
  useEffect(() => {
    if (typeof claude !== "undefined" && claude.use) return;
    if (!driveConfigured()) { setDriveStatus("unavailable"); return; }
    let cancelled = false;
    let tries = 0;
    const check = () => {
      if (cancelled) return;
      if (window.google && window.google.accounts && window.google.accounts.oauth2) {
        driveTokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: () => {},
        });
        setDriveStatus("disconnected");
        const cached = loadCachedDriveToken();
        if (cached) driveSync(cached.token, { silent: true });
      } else if (tries < 25) {
        tries += 1; setTimeout(check, 300);
      } else {
        setDriveStatus("unavailable");
      }
    };
    check();
    return () => { cancelled = true; };
  }, []);

  /* Récupère les changements faits depuis un autre appareil (à la prise de
     focus et toutes les 45s pendant que l'onglet est visible). */
  useEffect(() => {
    if (driveStatus !== "connected") return;
    const pull = async () => {
      const cached = loadCachedDriveToken();
      if (!cached || !driveFileIdRef.current) return;
      try {
        const remote = await driveReadFile(cached.token, driveFileIdRef.current);
        if (remote) {
          const remoteStr = JSON.stringify(remote);
          if (remoteStr !== driveLastPayloadRef.current) {
            driveLastPayloadRef.current = remoteStr;
            setDb(withDefaults(remote));
            setDriveLastSync(new Date());
          }
        }
      } catch (e) {}
    };
    const interval = setInterval(pull, 45000);
    const onFocus = () => pull();
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onFocus);
    return () => { clearInterval(interval); window.removeEventListener("focus", onFocus); document.removeEventListener("visibilitychange", onFocus); };
  }, [driveStatus]);

  useEffect(() => {
    (async () => {
      try {
        if (typeof claude !== "undefined" && claude.use) {
          const dbCap = await claude.use("db");
          const userCap = await claude.use("user");
          const viewerId = userCap ? await userCap.id() : null;
          if (dbCap && viewerId) {
            dbDocRef.current = dbCap.doc("data/users/" + viewerId + "/atelier");
            const snap = await dbDocRef.current.get();
            if (snap.exists && snap.data()) { setDb(withDefaults(snap.data())); return; }
            setDb(seedData());
            return;
          }
        }
      } catch (e) {}
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { setDb(withDefaults(JSON.parse(raw))); return; }
      } catch (e) {}
      setDb(seedData());
    })();
  }, []);

  const [syncMode, setSyncMode] = useState("local");
  const [initialLot, setInitialLot] = useState(null);

  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const lot = params.get("lot");
      if (lot) { setInitialLot(lot); setTab("tracabilite"); }
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (!db) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        if (dbDocRef.current) {
          await dbDocRef.current.set(db);
          setSyncMode("cloud");
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          if (driveStatus === "connected" && driveFileIdRef.current) {
            const cached = loadCachedDriveToken();
            if (cached) {
              try {
                await driveWriteFile(cached.token, driveFileIdRef.current, db);
                driveLastPayloadRef.current = JSON.stringify(db);
                setDriveLastSync(new Date());
              } catch (e) { /* reste en local, retentera à la prochaine sauvegarde */ }
            }
          }
          setSyncMode(driveStatus === "connected" ? "drive" : "local");
        }
        setStatus("Enregistré");
      } catch (e) { setStatus("Échec enregistrement"); }
      setTimeout(() => setStatus(""), 1500);
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [db, driveStatus]);

  const logMovement = (type, detail) =>
    setDb((prev) => ({ ...prev, movements: [{ id: uid(), date: todayISO(), type, detail }, ...prev.movements].slice(0, 300) }));

  const [navOpen, setNavOpen] = useState(false);

  if (!db) {
    return <Shell><div className="h-64 flex items-center justify-center text-slate-400 text-sm">Chargement de l'atelier…</div></Shell>;
  }

  return (
    <Shell>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap');
        h1,h2,h3,.font-display{font-family:'Sora',system-ui,sans-serif;}
        .ma-shell { background:
          radial-gradient(circle at 92% 6%, rgba(53,192,216,.11), transparent 24%),
          radial-gradient(circle at 16% 32%, rgba(11,145,174,.06), transparent 22%),
          #F4FAFC;
        }
        .ma-sidebar { box-shadow: 8px 0 28px rgba(7,81,106,.10); background:
          radial-gradient(circle at 10% 8%, rgba(53,192,216,.16), transparent 24%),
          linear-gradient(180deg,#062B3D 0%,#073B50 52%,#062A3B 100%) !important;
        }
        .ma-brand-card { border:1px solid rgba(255,255,255,.22); border-radius:18px; padding:6px; box-shadow:0 12px 28px rgba(0,0,0,.18); }
        .ma-brand-card img { border-radius:13px; }
        .ma-sidebar nav button { border:1px solid transparent; }
        .ma-sidebar nav button:hover { background:rgba(53,192,216,.12) !important; color:#fff !important; border-color:rgba(53,192,216,.14); }
        .ma-topbar { box-shadow:0 4px 18px rgba(7,81,106,.06); }
        .ma-main > * { animation: maFade .22s ease-out; }
        @keyframes maFade { from { opacity:.72; transform:translateY(3px); } to { opacity:1; transform:none; } }
        .ma-shell .bg-white.rounded-lg, .ma-shell .bg-white.rounded-md,
        .ma-shell .bg-white.rounded-xl { border-color:#D7EEF2 !important; box-shadow:0 5px 18px rgba(7,81,106,.055) !important; }
        .ma-shell input, .ma-shell select, .ma-shell textarea { border-color:#CDE6EC !important; background:#FBFEFF !important; }
        .ma-shell input:focus, .ma-shell select:focus, .ma-shell textarea:focus { box-shadow:0 0 0 3px rgba(53,192,216,.18) !important; border-color:#35C0D8 !important; }
        .ma-shell .border-slate-200 { border-color:#D7EEF2 !important; }
        .ma-shell .border-slate-300 { border-color:#CDE6EC !important; }
        .ma-shell .border-slate-100 { border-color:#E5F3F6 !important; }
        .ma-shell .text-slate-500 { color:#557384 !important; }
        .ma-shell .text-slate-400 { color:#5A7787 !important; }
        .ma-shell .text-slate-600 { color:#35596A !important; }
        .ma-shell .text-slate-700 { color:#21475A !important; }
        .ma-shell .bg-slate-50 { background:#F2FAFC !important; }
        .ma-shell .bg-slate-100 { background:#E9F6F9 !important; }
        .ma-shell .rounded-lg { border-radius:14px !important; }
        .ma-shell .rounded-md { border-radius:10px !important; }
        .ma-shell button { transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
        .ma-shell button:hover:not(:disabled) { transform:translateY(-1px); }

        .no-scrollbar::-webkit-scrollbar{display:none;}
        .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
        @media print {
          body * { visibility: hidden; }
          #print-label-area, #print-label-area *, #print-receipt-area, #print-receipt-area *, #print-traceability-area, #print-traceability-area * { visibility: visible; }
          #print-label-area { position: absolute; top: 0; left: 0; }
          #print-receipt-area { position: absolute; top: 0; left: 0; width: 80mm; padding: 4mm; }
          #print-traceability-area { position: absolute; top: 0; left: 0; width: 100%; }
          @page { size: A4; margin: 15mm; }
        }
      `}</style>

      <div className="flex min-h-screen">
        <Sidebar tab={tab} setTab={(t) => { setTab(t); setNavOpen(false); }} navOpen={navOpen} setNavOpen={setNavOpen} />
        <div className="flex-1 min-w-0 flex flex-col">
          <TopBar db={db} status={status} syncMode={syncMode} setTab={setTab} onMenu={() => setNavOpen(true)} />
          <main className="flex-1 max-w-[1440px] w-full mx-auto px-3 sm:px-6 py-5 sm:py-6 ma-main">
            {tab === "accueil" && <Accueil db={db} setTab={setTab} syncMode={syncMode} driveStatus={driveStatus} connectDrive={connectDrive} />}

            {tab === "tarification" && <Tarification db={db} setDb={setDb} />}
            {tab === "production" && <Production db={db} setDb={setDb} logMovement={logMovement} />}
            {tab === "caisse" && <Caisse db={db} setDb={setDb} logMovement={logMovement} />}

            {tab === "etiquettes" && <Etiquettes db={db} />}

            {tab === "atelier" && (

            {tab === "sauvegarde" && <Sauvegarde db={db} setDb={setDb} driveStatus={driveStatus} driveLastSync={driveLastSync} connectDrive={connectDrive} disconnectDrive={disconnectDrive} />}

}

function TopBar({ db, status, syncMode, setTab, onMenu }) {
  const [query, setQuery] = useState("");
  const [showNotifs, setShowNotifs] = useState(false);

  const alerts = useMemo(() => {
    const mat = db.rawMaterials.filter((m) => m.stockQuantity <= m.reorderThreshold).map((m) => ({ label: `Stock faible — ${m.name}`, tab: "matieres" }));
    const prod = db.products.filter((p) => p.stockQuantity <= p.alertThreshold).map((p) => ({ label: `Stock faible — ${p.name}`, tab: "produits" }));
    const cure = db.batches.filter((b) => b.status === "En Cure").map((b) => ({ label: `Lot en cours — ${b.batchNumber}`, tab: "production" }));
    return [...mat, ...prod, ...cure];
  }, [db]);

  const results = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const out = [];
    db.products.forEach((p) => { if (p.name.toLowerCase().includes(q) || p.sku.includes(q)) out.push({ label: p.name, hint: `Produit · SKU ${p.sku}`, tab: "produits" }); });
    db.rawMaterials.forEach((m) => { if (m.name.toLowerCase().includes(q)) out.push({ label: m.name, hint: "Matière première", tab: "matieres" }); });
    db.batches.forEach((b) => { if (b.batchNumber.toLowerCase().includes(q)) out.push({ label: b.batchNumber, hint: "Lot", tab: "tracabilite" }); });
    (db.clients || []).forEach((c) => { if (c.name.toLowerCase().includes(q)) out.push({ label: c.name, hint: "Client", tab: "clients" }); });
    (db.suppliers || []).forEach((s) => { if (s.name.toLowerCase().includes(q)) out.push({ label: s.name, hint: "Fournisseur", tab: "fournisseurs" }); });
    return out.slice(0, 8);
  }, [db, query]);

  return (
    <header className="bg-white border-b border-slate-200 sticky top-0 z-20 ma-topbar">
      <div className="px-3 sm:px-6 py-2.5 flex items-center gap-3">
        <button className="md:hidden text-slate-500" onClick={onMenu}><Menu size={20} /></button>
        <div className="relative flex-1 max-w-md">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Rechercher un produit, une matière, un lot…"
            className="w-full border border-slate-200 rounded-md pl-8 pr-3 py-2 text-[13px] bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#2FB6CE] focus:border-transparent" />
          {results.length > 0 && (
            <div className="absolute mt-1 w-full bg-white border border-slate-200 rounded-md shadow-lg overflow-hidden z-30">
              {results.map((r, i) => (
                <button key={i} onClick={() => { setTab(r.tab); setQuery(""); }}
                  className="w-full text-left px-3 py-2 text-[13px] hover:bg-slate-50 flex items-center justify-between gap-2">
                  <span className="truncate">{r.label}</span>
                  <span className="text-[11px] text-slate-400 shrink-0">{r.hint}</span>
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="ml-auto flex items-center gap-3 sm:gap-4 shrink-0">
          <div className="relative">
            <button onClick={() => setShowNotifs((s) => !s)} className="relative text-slate-500">
              <Bell size={19} />
              {alerts.length > 0 && (
                <span className="absolute -top-1.5 -right-1.5 bg-[#9A3F2E] text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{alerts.length}</span>
              )}
            </button>
            {showNotifs && (
              <div className="absolute right-0 mt-2 w-72 bg-white border border-slate-200 rounded-md shadow-lg z-30 max-h-72 overflow-y-auto">
                {alerts.length === 0 ? (
                  <p className="text-[13px] text-slate-400 px-3 py-3">Aucune alerte à surveiller.</p>
                ) : alerts.map((a, i) => (
                  <button key={i} onClick={() => { setTab(a.tab); setShowNotifs(false); }}
                    className="w-full text-left px-3 py-2.5 text-[13px] border-b border-slate-50 hover:bg-slate-50 flex items-center gap-2">
                    <AlertTriangle size={14} style={{ color: BRICK }} className="shrink-0" />{a.label}
                  </button>
                ))}
              </div>
            )}
          </div>
          <span className="hidden sm:flex items-center gap-1.5 text-[12px]" style={{ color: syncMode === "local" ? "#8A97AC" : SAGE }} title={syncMode === "cloud" ? "Sauvegardé sur votre compte" : syncMode === "drive" ? "Synchronisé avec Google Drive" : "Sauvegarde locale (hors-ligne)"}>
            {syncMode === "local" ? <CloudOff size={16} /> : <Cloud size={16} />}
            {syncMode === "cloud" ? "En ligne" : syncMode === "drive" ? "Google Drive" : "Local"}
            {status && <span className="text-slate-400">· {status}</span>}
          </span>
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-[12px] font-semibold shrink-0" style={{ background: TEAL }}>
            {(db.workshop.name || "M A").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase()}
          </div>
        </div>
      </div>
    </header>
  );
}

function LineChartCanvas({ labels, data, color }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [{
          data, borderColor: color || TEAL, backgroundColor: (color || TEAL) + "1F",
          fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: color || TEAL, borderWidth: 2,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => fmtEUR(ctx.parsed.y) } } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: (v) => fmtEUR(v), font: { size: 10 } }, grid: { color: "#F1F5F9" } },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(data), color]);
  return <div style={{ height: 210 }}><canvas ref={canvasRef} /></div>;
}

function DonutChartCanvas({ labels, data, colors }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "doughnut",
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: "68%",
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.label} : ${fmtEUR(ctx.parsed)}` } } },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(labels), JSON.stringify(data), JSON.stringify(colors)]);
  return <div style={{ height: 170 }}><canvas ref={canvasRef} /></div>;
}

function KpiCard({ label, value, icon: Icon, tone = "neutral", hint }) {
  const tones = {
    neutral: { bg: "white", fg: INK, iconBg: PALE, iconFg: TEAL },
    hero: { bg: `linear-gradient(135deg, ${TEAL_DEEP}, ${TEAL})`, fg: "white", iconBg: "rgba(255,255,255,.16)", iconFg: "white" },
    alert: { bg: "white", fg: BRICK, iconBg: "#FFF0EF", iconFg: BRICK },
    ok: { bg: "white", fg: SAGE, iconBg: "#E5F4EF", iconFg: SAGE },
  };
  const t = tones[tone];
  return (
    <div className="rounded-lg p-4 border border-slate-200" style={{ background: t.bg }}>
      <div className="flex items-center gap-2.5 mb-2">
        <div className="w-8 h-8 rounded-md flex items-center justify-center shrink-0" style={{ background: t.iconBg, color: t.iconFg }}>
          <Icon size={16} />
        </div>
        <p className="text-[12px] text-slate-500 leading-tight">{label}</p>
      </div>
      <p className="font-display text-xl sm:text-2xl" style={{ color: t.fg }}>{value}</p>
      {hint && <p className="text-[11px] text-slate-400 mt-0.5">{hint}</p>}
    </div>
  );
}

function Accueil({ db, setTab, syncMode, driveStatus, connectDrive }) {
  const stats = useMemo(() => {
    let ca = 0, caJour = 0;
    const today = todayISO();
    const byMonth = {};
    const byChannel = {};
    db.sales.forEach((o) => {
      const monthKey = o.date.slice(0, 7);
      o.items.forEach((it) => {
        const total = it.qty * it.unitPrice;
        ca += total;
        if (o.date === today) caJour += total;
        byMonth[monthKey] = (byMonth[monthKey] || 0) + total;
        byChannel[o.channel] = (byChannel[o.channel] || 0) + total;
      });
    });
    const stockFini = db.products.reduce((s, p) => s + p.stockQuantity, 0);
    const alertesMatieres = db.rawMaterials.filter((m) => m.stockQuantity <= m.reorderThreshold);
    const alertesProduits = db.products.filter((p) => p.stockQuantity <= p.alertThreshold);
    const dernieresVentes = [...db.sales].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);
    const enCours = db.batches.filter((b) => b.status !== "Conforme").slice(0, 5);
    const derniersLots = [...db.batches].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);

    const months = [];
    const d = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push({ key: `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`, label: dt.toLocaleDateString("fr-FR", { month: "short" }) });
    }
    const monthLabels = months.map((m) => m.label);
    const monthValues = months.map((m) => byMonth[m.key] || 0);

    const channelColors = { "Marché": TEAL, "B2C Direct": ACCENT, "B2B Boutique": SAGE, "Boutique Éphémère": BRICK, "Commande Sur Mesure": "#8A97AC" };
    const channelLabels = Object.keys(byChannel);
    const channelValues = channelLabels.map((c) => byChannel[c]);
    const channelColorList = channelLabels.map((c) => channelColors[c] || "#CBD5E1");

    return { ca, caJour, stockFini, alertesMatieres, alertesProduits, dernieresVentes, enCours, derniersLots, monthLabels, monthValues, channelLabels, channelValues, channelColorList };
  }, [db]);

  const alertCount = stats.alertesMatieres.length + stats.alertesProduits.length;

  return (
    <div className="space-y-5">
      <div>
        <h2 className="font-display text-xl sm:text-2xl" style={{ color: INK }}>Tableau de bord</h2>
        <p className="text-[13px] text-slate-500">Vue d'ensemble de votre activité</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <KpiCard label="CA du jour" value={fmtEUR(stats.caJour)} icon={TrendingUp} tone="hero" hint="Aujourd’hui" />
        <KpiCard label="CA cumulé" value={fmtEUR(stats.ca)} icon={ShoppingCart} hint={`${db.sales.length} commande(s)`} />
        <KpiCard label="Produits actifs" value={db.products.length} icon={Package} hint={`${stats.stockFini} unités en stock`} />
        <KpiCard label="Lots actifs" value={db.batches.length} icon={GitBranch} />
        <KpiCard label="Alertes stock" value={alertCount} icon={AlertTriangle} tone={alertCount > 0 ? "alert" : "ok"} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2 bg-white rounded-lg border border-slate-200 p-4 sm:p-5">
          <h3 className="text-[15px] font-semibold mb-1" style={{ color: INK }}>Évolution du chiffre d'affaires</h3>
          <p className="text-[12px] text-slate-400 mb-2">6 derniers mois</p>
          <LineChartCanvas labels={stats.monthLabels} data={stats.monthValues} color={TEAL} />
        </div>

function Produits({ db, setDb }) {
  const update = (id, patch) => setDb((prev) => ({ ...prev, products: prev.products.map((p) => (p.id === id ? { ...p, ...patch } : p)) }));
  const [openBarcode, setOpenBarcode] = useState(null);
  const [query, setQuery] = useState("");

  const filtered = db.products.filter((p) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q);
  });

  return (
    <div className="space-y-5">
      <Card title="Catalogue produits" icon={Package} right={<Badge tone="accent">Création automatique depuis la Production</Badge>}>
        <TableSearch value={query} onChange={setQuery} placeholder="Rechercher un produit, un SKU…" />
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
                <th className="pb-2 font-medium">SKU</th>
                <th className="pb-2 font-medium">Produit</th>
                <th className="pb-2 font-medium">Prix</th>
                <th className="pb-2 font-medium">Stock</th>
                <th className="pb-2 font-medium">Seuil d'alerte</th>
                <th className="pb-2 font-medium">Statut</th>
                <th className="pb-2 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((p) => {
                const alert = p.stockQuantity <= p.alertThreshold;
                return (
                  <React.Fragment key={p.id}>
                    <tr className="border-b border-slate-50">
                      <td className="py-2.5 font-mono text-[12px] text-slate-500">MA-{p.sku}</td>
                      <td className="py-2.5 text-slate-700">{p.name}</td>
                      <td className="py-2.5">
                        <input type="number" min="0" step="0.01" className={inputCls + " w-24"} value={p.pricePublic}
                          onChange={(e) => update(p.id, { pricePublic: clampNonNegative(e.target.value, p.pricePublic) })} />
                      </td>
                      <td className="py-2.5">{p.stockQuantity}</td>
                      <td className="py-2.5">
                        <input type="number" min="0" step="1" className={inputCls + " w-20"} value={p.alertThreshold}
                          onChange={(e) => update(p.id, { alertThreshold: clampNonNegative(e.target.value, p.alertThreshold) })} />
                      </td>
                      <td className="py-2.5">
                        {alert ? <Badge tone="alert"><AlertTriangle size={11} /> Bas</Badge> : <Badge tone="ok"><CheckCircle2 size={11} /> OK</Badge>}
                      </td>
                      <td className="py-2.5 text-right">
                        <Btn size="sm" variant="ghost" onClick={() => setOpenBarcode(openBarcode === p.id ? null : p.id)}>Code 128 local</Btn>
                      </td>
                    </tr>
                    {openBarcode === p.id && (
                      <tr>
                        <td colSpan={7} className="pb-4">
                          <div className="bg-slate-50 rounded-md p-3 inline-block">
                            <Barcode39 value={p.sku} height={40} className="w-48" />
                            <p className="text-[11px] text-slate-400 mt-1 font-mono text-center">MA-{p.sku}</p>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {filtered.length === 0 && (
                <tr><td colSpan={7} className="py-6 text-center text-slate-400 text-sm">
                  {db.products.length === 0 ? "Aucun produit — lancez un ordre de fabrication dans l'onglet Production." : "Aucun résultat pour cette recherche."}
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function TableSearch({ value, onChange, placeholder }) {
  return (
    <div className="relative mb-3 max-w-xs">
      <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400" />
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder || "Rechercher…"}
        className="w-full border border-slate-200 rounded-md pl-8 pr-3 py-1.5 text-[13px] focus:outline-none focus:ring-2 focus:ring-[#2FB6CE] focus:border-transparent" />
    </div>
  );
}

function MaterialPriceHistory({ material, onClose }) {
  const history = (material.priceHistory && material.priceHistory.length > 0)
    ? [...material.priceHistory].sort((a, b) => (a.date < b.date ? -1 : 1))
    : [{ date: "—", price: material.purchasePrice }];
  const first = history[0].price;
  const last = history[history.length - 1].price;
  const changePct = first > 0 ? ((last - first) / first) * 100 : 0;

  return (
    <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-30 p-4">
      <div className="bg-white rounded-lg max-w-md w-full p-5 relative max-h-[85vh] overflow-y-auto">
        <button onClick={onClose} className="absolute top-3 right-3 text-slate-300"><X size={16} /></button>
        <p className="font-display text-base mb-0.5" style={{ color: INK }}>{material.name}</p>
        <p className="text-[12px] text-slate-400 mb-4">Historique du prix d'achat — {material.supplier}</p>

        {history.length > 1 ? (
          <>
            <LineChartCanvas labels={history.map((h) => h.date)} data={history.map((h) => h.price)} color={TEAL} />
            <p className="text-[12px] text-slate-500 mt-2">
              {fmtEUR(first)} → {fmtEUR(last)}{" "}
              <span style={{ color: changePct > 0 ? BRICK : changePct < 0 ? SAGE : "#94A3B8" }}>
                ({changePct > 0 ? "+" : ""}{fmtNum(changePct, 1)}%)
              </span>
            </p>
          </>
        ) : (
          <p className="text-sm text-slate-400 mb-2">Aucun historique de variation pour le moment — le prix évoluera ici au fil de vos réceptions d'achats ou du simulateur d'impact tarifaire.</p>
        )}

        <div className="mt-3 space-y-1.5">
          {[...history].reverse().map((h, i) => (
            <div key={i} className="flex justify-between text-sm border-b border-slate-50 pb-1">
              <span className="text-slate-500">{h.date}</span>
              <span className="font-medium">{fmtEUR(h.price)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MatieresPremieres({ db, setDb, logMovement }) {
  const [showForm, setShowForm] = useState(false);
  const [adjusting, setAdjusting] = useState(null);
  const [form, setForm] = useState({ name: "", category: "Cire", supplier: "", unit: "g", purchasePrice: "", stockQuantity: "", reorderThreshold: "" });
  const [error, setError] = useState("");
  const [query, setQuery] = useState("");
  const [historyMaterial, setHistoryMaterial] = useState(null);

  const filteredMaterials = db.rawMaterials.filter((m) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q) || m.supplier.toLowerCase().includes(q);
  });

  const addMaterial = () => {
    if (!form.name.trim()) { setError("Le nom de la matière est obligatoire."); return; }
    if (db.rawMaterials.some((m) => m.name.trim().toLowerCase() === form.name.trim().toLowerCase())) { setError("Une matière porte déjà ce nom."); return; }
    if (!isPositiveNumber(form.purchasePrice)) { setError("Le prix d'achat doit être un nombre supérieur à 0."); return; }
    if (form.stockQuantity === "" || !Number.isFinite(Number(form.stockQuantity)) || Number(form.stockQuantity) < 0) { setError("La quantité reçue doit être un nombre positif ou nul."); return; }
    if (form.reorderThreshold !== "" && (!Number.isFinite(Number(form.reorderThreshold)) || Number(form.reorderThreshold) < 0)) { setError("Le seuil de réapprovisionnement doit être positif ou nul."); return; }
    setError("");
    const qty = Number(form.stockQuantity);
    setDb((prev) => ({
      ...prev,
      rawMaterials: [...prev.rawMaterials, {
        id: uid(), name: form.name.trim(), category: form.category, supplier: form.supplier.trim() || "Non renseigné", unit: form.unit,
        purchasePrice: Number(form.purchasePrice), freightPct: 0.2, initialQty: qty, stockQuantity: qty, reorderThreshold: clampNonNegative(form.reorderThreshold, 0),
        priceHistory: [{ date: todayISO(), price: Number(form.purchasePrice) }],
      }],
    }));
    logMovement("Achat", `Nouvelle matière référencée : ${form.name.trim()}`);
    setForm({ name: "", category: "Cire", supplier: "", unit: "g", purchasePrice: "", stockQuantity: "", reorderThreshold: "" });
    setShowForm(false);
  };

  const deleteMaterial = (id) => setDb((prev) => ({ ...prev, rawMaterials: prev.rawMaterials.filter((m) => m.id !== id) }));

  const adjustStock = (id, delta, reason) => {
    if (!delta) return;
    const m = db.rawMaterials.find((x) => x.id === id);
    setDb((prev) => ({ ...prev, rawMaterials: prev.rawMaterials.map((x) => (x.id === id ? { ...x, stockQuantity: Math.max(0, x.stockQuantity + delta) } : x)) }));
    logMovement("Ajustement", `${delta > 0 ? "+" : ""}${delta} ${m?.unit || ""} sur ${m?.name} (${reason})`);
    setAdjusting(null);
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h2 className="font-display text-xl" style={{ color: INK }}>Matières premières &amp; consommables</h2>
        <Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Ajouter une matière</Btn>
      </div>

      {showForm && (
        <Card>
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            <Field label="Nom"><input className={inputCls} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></Field>
            <Field label="Catégorie">
              <select className={inputCls} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
                {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Fournisseur">
              <input className={inputCls} list="suppliers-datalist" value={form.supplier} onChange={(e) => setForm({ ...form, supplier: e.target.value })} />
              <datalist id="suppliers-datalist">{db.suppliers.map((s) => <option key={s.id} value={s.name} />)}</datalist>
            </Field>
            <Field label="Unité">
              <select className={inputCls} value={form.unit} onChange={(e) => setForm({ ...form, unit: e.target.value })}>
                {UNITS.map((u) => <option key={u}>{u}</option>)}
              </select>
            </Field>
            <Field label="Prix d'achat (€)"><input type="number" className={inputCls} value={form.purchasePrice} onChange={(e) => setForm({ ...form, purchasePrice: e.target.value })} /></Field>
            <Field label="Quantité reçue"><input type="number" className={inputCls} value={form.stockQuantity} onChange={(e) => setForm({ ...form, stockQuantity: e.target.value })} /></Field>
            <Field label="Seuil de réapprovisionnement"><input type="number" className={inputCls} value={form.reorderThreshold} onChange={(e) => setForm({ ...form, reorderThreshold: e.target.value })} /></Field>
          </div>
          <p className="text-[12px] text-slate-400 mt-2">Fret + octroi de mer appliqué automatiquement : 20 %.</p>
          <ErrorText>{error}</ErrorText>
          <div className="flex gap-2 mt-3">
            <Btn onClick={addMaterial}>Enregistrer</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Annuler</Btn>
          </div>
        </Card>
      )}

      <Card>
        <TableSearch value={query} onChange={setQuery} placeholder="Rechercher une matière, une catégorie, un fournisseur…" />
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
                <th className="pb-2 font-medium">Matière</th>
                <th className="pb-2 font-medium">Unité</th>
                <th className="pb-2 font-medium">Prix d'achat</th>
                <th className="pb-2 font-medium">Fret + octroi de mer</th>
                <th className="pb-2 font-medium">Coût rendu estimatif</th>
                <th className="pb-2 font-medium">Stock / seuil</th>
                <th className="pb-2 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              {filteredMaterials.map((m) => {
                const alert = m.stockQuantity <= m.reorderThreshold;
                return (
                  <tr key={m.id} className="border-b border-slate-50">
                    <td className="py-2.5"><p className="font-medium text-slate-700">{m.name}</p><p className="text-[12px] text-slate-400">{m.category} · {m.supplier}</p></td>
                    <td className="py-2.5 text-slate-500">{m.unit}</td>
                    <td className="py-2.5 text-slate-500">
                      <button onClick={() => setHistoryMaterial(m)} className="hover:underline flex items-center gap-1" title="Voir l'historique du prix">
                        {fmtEUR(m.purchasePrice)} <TrendingUp size={12} className="text-slate-300" />
                      </button>
                    </td>
                    <td className="py-2.5 text-slate-500">+{Math.round(m.freightPct * 100)}%</td>
                    <td className="py-2.5 text-slate-700">{fmtEUR(unitCostGuyane(m))} / {m.unit}</td>
                    <td className="py-2.5">
                      <div className="flex items-center gap-1.5">
                        <span className={alert ? "text-[#9A3F2E]" : "text-slate-700"}>{fmtNum(m.stockQuantity)}</span>
                        <span className="text-slate-400 text-[12px]">/ seuil {fmtNum(m.reorderThreshold)}</span>
                        {alert && <Badge tone="alert"><AlertTriangle size={11} /></Badge>}
                      </div>
                    </td>
                    <td className="py-2.5 text-right whitespace-nowrap">
                      {adjusting === m.id ? (
                        <AdjustRow unit={m.unit} onCancel={() => setAdjusting(null)} onApply={(delta, reason) => adjustStock(m.id, delta, reason)} />
                      ) : (
                        <div className="flex items-center gap-2 justify-end">
                          <Btn size="sm" variant="ghost" onClick={() => setAdjusting(m.id)}>Ajuster</Btn>
                          <button onClick={() => deleteMaterial(m.id)} className="text-slate-300 hover:text-[#9A3F2E]"><Trash2 size={14} /></button>
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
              {filteredMaterials.length === 0 && (
                <tr><td colSpan={7} className="py-4 text-slate-400 text-center">{db.rawMaterials.length === 0 ? "Aucune matière première enregistrée." : "Aucun résultat pour cette recherche."}</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>

      <PriceSimulator db={db} setDb={setDb} />
      {historyMaterial && <MaterialPriceHistory material={historyMaterial} onClose={() => setHistoryMaterial(null)} />}
    </div>
  );
}

function AdjustRow({ unit, onApply, onCancel }) {
  const [delta, setDelta] = useState("");
  const [reason, setReason] = useState("Perte");
  return (
    <div className="flex items-center gap-1.5 justify-end flex-wrap">
      <input type="number" placeholder={`± ${unit}`} className={inputCls + " w-20"} value={delta} onChange={(e) => setDelta(e.target.value)} />
      <select className={inputCls} value={reason} onChange={(e) => setReason(e.target.value)}>
        <option>Perte</option><option>Casse</option><option>Échantillon offert</option><option>Réception fournisseur</option>
      </select>
      <Btn size="sm" onClick={() => onApply(Number(delta), reason)}>OK</Btn>
      <button onClick={onCancel} className="text-slate-300"><X size={14} /></button>
    </div>
  );
}

function PriceSimulator({ db, setDb }) {
  const [pct, setPct] = useState(10);
  const [category, setCategory] = useState("Toutes");

  const impact = useMemo(() => {
    const simMaterials = db.rawMaterials.map((m) =>
      category === "Toutes" || m.category === category
        ? { ...m, purchasePrice: m.purchasePrice * (1 + pct / 100) }
        : m
    );
    return db.recipes.map((r) => {
      const current = recipeUnitCost(r, db.rawMaterials);
      const simulated = recipeUnitCost(r, simMaterials);
      const product = db.products.find((p) => p.recipeId === r.id);
      const marginCurrent = product ? product.pricePublic - current : null;
      const marginSimulated = product ? product.pricePublic - simulated : null;
      return { name: r.name, product, current, simulated, marginCurrent, marginSimulated };
    });
  }, [db, pct, category]);

  const apply = () => {
    setDb((prev) => ({
      ...prev,
      rawMaterials: prev.rawMaterials.map((m) => {
        if (category !== "Toutes" && m.category !== category) return m;
        const newPrice = Math.round(m.purchasePrice * (1 + pct / 100) * 100) / 100;
        const history = [...(m.priceHistory || [{ date: todayISO(), price: m.purchasePrice }]), { date: todayISO(), price: newPrice }];
        return { ...m, purchasePrice: newPrice, priceHistory: history };
      }),
    }));
  };

  const targetLabel = category === "Toutes" ? "toutes les matières premières" : `la catégorie « ${category} »`;

  return (
    <Card title="Simulateur d'impact tarifaire" icon={TrendingUp}>
      <p className="text-sm text-slate-500 mb-3">
        Et si le prix de {category === "Toutes" ? "vos matières" : <strong>{category.toLowerCase()}</strong>} augmentait de X % ? Anticipez l'impact sur le coût de revient et vos marges avant que la hausse fournisseur n'arrive.
      </p>
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <Field label="Matière concernée">
          <select className={inputCls} value={category} onChange={(e) => setCategory(e.target.value)}>
            <option>Toutes</option>
            {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
          </select>
        </Field>
        <div className="flex items-center gap-3 flex-1 min-w-[180px]">
          <input type="range" min="-30" max="50" value={pct} onChange={(e) => setPct(Number(e.target.value))} className="flex-1" />
          <span className="text-sm font-medium w-16 text-right" style={{ color: TEAL }}>{pct > 0 ? "+" : ""}{pct}%</span>
        </div>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
              <th className="pb-2 font-medium">Recette</th>
              <th className="pb-2 font-medium">Coût de revient</th>
              <th className="pb-2 font-medium">Marge actuelle</th>
              <th className="pb-2 font-medium">Marge simulée</th>
            </tr>
          </thead>
          <tbody>
            {impact.map((r, i) => (
              <tr key={i} className="border-b border-slate-50">
                <td className="py-2 text-slate-700">{r.name}</td>
                <td className="py-2">
                  {fmtEUR(r.current)} → <span style={{ color: r.simulated > r.current ? BRICK : SAGE }}>{fmtEUR(r.simulated)}</span>
                </td>
                <td className="py-2 text-slate-500">{r.marginCurrent != null ? fmtEUR(r.marginCurrent) : "—"}</td>
                <td className="py-2">
                  {r.marginSimulated != null ? (
                    <span style={{ color: r.marginSimulated < r.marginCurrent ? BRICK : SAGE }}>
                      {fmtEUR(r.marginSimulated)} {r.product && r.product.pricePublic > 0 ? `(${fmtNum((r.marginSimulated / r.product.pricePublic) * 100, 0)}%)` : ""}
                    </span>
                  ) : "—"}
                </td>
              </tr>
            ))}
            {impact.length === 0 && (
              <tr><td colSpan={4} className="py-4 text-slate-400 text-center">Aucune recette enregistrée pour le moment.</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">Marge = prix public actuel − coût de revient recette. La marge simulée suppose un prix de vente inchangé.</p>
      <div className="mt-3">
        <Btn variant="ghost" size="sm" onClick={apply}><RotateCcw size={13} /> Appliquer {pct > 0 ? "+" : ""}{pct}% sur {targetLabel}</Btn>
      </div>
    </Card>
  );
}

function Recettes({ db, setDb }) {
  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState("");
  const [texture, setTexture] = useState("Solide");
  const [netWeight, setNetWeight] = useState("");
  const [yieldPct, setYieldPct] = useState(100);
  const [fragrance, setFragrance] = useState("");
  const [items, setItems] = useState([{ materialId: db.rawMaterials[0]?.id || "", qty: "" }]);
  const [error, setError] = useState("");

  const addItemRow = () => setItems([...items, { materialId: db.rawMaterials[0]?.id || "", qty: "" }]);
  const updateItem = (i, patch) => setItems(items.map((it, idx) => (idx === i ? { ...it, ...patch } : it)));
  const removeItem = (i) => setItems(items.filter((_, idx) => idx !== i));

  const save = () => {
    if (!name.trim()) { setError("Le nom du produit/recette est obligatoire."); return; }
    if (db.recipes.some((r) => r.name.trim().toLowerCase() === name.trim().toLowerCase())) { setError("Une recette porte déjà ce nom."); return; }
    if (!isPositiveNumber(netWeight)) { setError("Le poids net doit être un nombre supérieur à 0."); return; }
    const yp = Number(yieldPct);
    if (!Number.isFinite(yp) || yp <= 0 || yp > 100) { setError("Le rendement doit être compris entre 1 et 100 %."); return; }
    const validItems = items.filter((it) => it.materialId && isPositiveNumber(it.qty));
    if (validItems.length === 0) { setError("Ajoutez au moins un ingrédient avec une quantité supérieure à 0."); return; }
    setError("");
    setDb((prev) => ({
      ...prev,
      recipes: [...prev.recipes, {
        id: uid(), name: name.trim(), textureType: texture, netWeight: Number(netWeight), netWeightUnit: "g", fragrance: fragrance.trim(),
        yieldPct: yp,
        items: validItems.map((it) => ({ materialId: it.materialId, qty: Number(it.qty) })),
      }],
    }));
    setName(""); setNetWeight(""); setFragrance(""); setYieldPct(100); setItems([{ materialId: db.rawMaterials[0]?.id || "", qty: "" }]);
    setShowForm(false);
  };

  return (
    <div className="space-y-4">
      <div className="flex justify-between items-center flex-wrap gap-2">
        <h3 className="font-display text-xl" style={{ color: INK }}>Fiches de formulation</h3>
        <Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Nouvelle recette</Btn>
      </div>

      {showForm && (
        <Card>
          {db.rawMaterials.length === 0 && (
            <p className="text-sm mb-3" style={{ color: BRICK }}>Aucune matière première enregistrée — créez-en d'abord dans l'onglet Matières premières pour pouvoir composer une recette.</p>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-3">
            <Field label="Nom du produit"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} /></Field>
            <Field label="Texture">
              <select className={inputCls} value={texture} onChange={(e) => setTexture(e.target.value)}>{TEXTURES.map((t) => <option key={t}>{t}</option>)}</select>
            </Field>
            <Field label="Poids net (g)"><input type="number" className={inputCls} value={netWeight} onChange={(e) => setNetWeight(e.target.value)} /></Field>
            <Field label="Rendement (%)"><input type="number" className={inputCls} value={yieldPct} onChange={(e) => setYieldPct(e.target.value)} /></Field>
            <Field label="Parfum (fiche de sécurité)"><input className={inputCls} value={fragrance} onChange={(e) => setFragrance(e.target.value)} placeholder="ex: Parfum Caramel" /></Field>
          </div>
          <p className="text-[13px] text-slate-500 mb-2">Composition (dosage pour 1 unité, à rendement 100%) :</p>
          <div className="space-y-2">
            {items.map((it, i) => (
              <div key={i} className="flex gap-2 items-center flex-wrap">
                <select className={inputCls + " flex-1 min-w-[160px]"} value={it.materialId} onChange={(e) => updateItem(i, { materialId: e.target.value })}>
                  {db.rawMaterials.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
                <input type="number" placeholder="Quantité" className={inputCls + " w-28"} value={it.qty} onChange={(e) => updateItem(i, { qty: e.target.value })} />
                <button onClick={() => removeItem(i)} className="text-slate-300 hover:text-[#9A3F2E]"><Trash2 size={14} /></button>
              </div>
            ))}
          </div>
          <Btn variant="ghost" size="sm" onClick={addItemRow}><Plus size={13} /> Ajouter un ingrédient</Btn>
          <ErrorText>{error}</ErrorText>
          <div className="flex gap-2 mt-4">
            <Btn onClick={save}>Enregistrer la recette</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Annuler</Btn>
          </div>
        </Card>
      )}

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {db.recipes.length === 0 && !showForm && (
          <p className="text-sm text-slate-400 md:col-span-2">Aucune recette enregistrée pour le moment.</p>
        )}
        {db.recipes.map((r) => (
          <Card key={r.id} title={r.name}>
            <div className="flex gap-2 mb-2 flex-wrap">
              <Badge>{r.textureType}</Badge>
              <Badge tone="accent">{r.netWeight}g</Badge>
              <Badge>Rendement {r.yieldPct || 100}%</Badge>
              {r.fragrance && <Badge>{r.fragrance}</Badge>}
            </div>
            <ul className="text-sm text-slate-500 space-y-1">
              {r.items.map((it, i) => {
                const m = db.rawMaterials.find((mm) => mm.id === it.materialId);
                return <li key={i}>{m?.name} — {it.qty}{m?.unit}</li>;
              })}
            </ul>
            <p className="text-[12px] text-slate-400 mt-2">Coût de revient estimé : {fmtEUR(recipeUnitCost(r, db.rawMaterials))} / unité (rendement inclus)</p>
          </Card>
        ))}
      </div>
    </div>
  );
}

function Tarification({ db, setDb }) {
  const [recipeId, setRecipeId] = useState(db.recipes[0]?.id || "");
  const [marginPct, setMarginPct] = useState(65);
  const [applied, setApplied] = useState(false);

  const recipe = db.recipes.find((r) => r.id === recipeId);
  const product = recipe && db.products.find((p) => p.recipeId === recipe.id);
  const hourlyRate = db.workshop.hourlyRate ?? 15;

  const materialsCost = recipe ? recipeUnitCost(recipe, db.rawMaterials) : 0;
  const packagingCost = recipe?.packagingCost ?? 0;
  const laborMinutes = recipe?.laborMinutes ?? 0;
  const laborCost = (laborMinutes / 60) * hourlyRate;
  const totalCost = materialsCost + packagingCost + laborCost;

  const safeMargin = Math.min(90, Math.max(0, marginPct));
  const suggestedPriceRaw = totalCost / (1 - safeMargin / 100);
  const suggestedPrice = Math.round(suggestedPriceRaw * 10) / 10;

  const currentPrice = product?.pricePublic ?? 0;
  const currentMarginPct = currentPrice > 0 ? ((currentPrice - totalCost) / currentPrice) * 100 : null;

  const updateRecipeField = (field, value) => {
    setDb((prev) => ({ ...prev, recipes: prev.recipes.map((r) => (r.id === recipeId ? { ...r, [field]: value } : r)) }));
  };
  const updateHourlyRate = (value) => {
    setDb((prev) => ({ ...prev, workshop: { ...prev.workshop, hourlyRate: value } }));
  };
  const applyPrice = () => {
    if (!product) return;
    setDb((prev) => ({ ...prev, products: prev.products.map((p) => (p.id === product.id ? { ...p, pricePublic: suggestedPrice } : p)) }));
    setApplied(true);
    setTimeout(() => setApplied(false), 2000);
  };

  return (
    <div className="space-y-5">
      <Card title="Calculateur de prix de vente" icon={Percent}>
        {db.recipes.length === 0 ? (
          <p className="text-sm text-slate-400">Créez d'abord une recette dans l'onglet Recettes.</p>
        ) : (
          <>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              <Field label="Recette / produit">
                <select className={inputCls} value={recipeId} onChange={(e) => setRecipeId(e.target.value)}>
                  {db.recipes.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </Field>
              <Field label="Taux horaire atelier (€/h)">
                <input type="number" min="0" step="0.5" className={inputCls} value={hourlyRate} onChange={(e) => updateHourlyRate(clampNonNegative(e.target.value, hourlyRate))} />
              </Field>
            </div>

            {!product && (
              <p className="text-[12px] mb-3" style={{ color: BRICK }}>
                Aucun produit catalogué n'utilise encore cette recette — le prix suggéré ne pourra être appliqué qu'une fois un premier lot produit (onglet Production).
              </p>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="space-y-3">
                <Field label="Coût matières (calculé — fret & octroi de mer inclus)">
                  <div className={inputCls + " bg-slate-50 text-slate-500"}>{fmtEUR(materialsCost)}</div>
                </Field>
                <Field label="Emballage / étiquette (€ par unité)">
                  <input type="number" min="0" step="0.05" className={inputCls} value={packagingCost} onChange={(e) => updateRecipeField("packagingCost", clampNonNegative(e.target.value, 0))} />
                </Field>
                <Field label="Temps de fabrication (minutes par unité)">
                  <input type="number" min="0" step="1" className={inputCls} value={laborMinutes} onChange={(e) => updateRecipeField("laborMinutes", clampNonNegative(e.target.value, 0))} />
                </Field>
                <div className="flex justify-between text-sm pt-2 border-t border-slate-100">
                  <span className="text-slate-500">Main d'œuvre ({fmtNum(laborMinutes, 0)} min × {fmtEUR(hourlyRate)}/h)</span>
                  <span className="font-medium">{fmtEUR(laborCost)}</span>
                </div>
                <div className="flex justify-between text-[15px] pt-2 border-t border-slate-200">
                  <span className="font-semibold" style={{ color: INK }}>Coût de revient total</span>
                  <span className="font-semibold" style={{ color: INK }}>{fmtEUR(totalCost)}</span>
                </div>
              </div>

              <div className="rounded-lg p-4" style={{ background: PALE }}>
                <Field label={`Marge cible sur prix de vente : ${safeMargin}%`}>
                  <input type="range" min="0" max="90" value={marginPct} onChange={(e) => setMarginPct(Number(e.target.value))} className="w-full" />
                </Field>
                <p className="text-[11px] text-slate-400 mb-3">Prix = coût de revient ÷ (1 − marge). Une marge de 65% correspond à un coefficient multiplicateur d'environ ×2,9 sur le coût.</p>

                <div className="bg-white rounded-md p-3 border border-slate-200">
                  <p className="text-[12px] text-slate-400">Prix de vente suggéré</p>
                  <p className="font-display text-2xl" style={{ color: TEAL }}>{fmtEUR(suggestedPrice)}</p>
                  <p className="text-[12px] text-slate-500 mt-1">Marge : {fmtEUR(suggestedPrice - totalCost)} ({fmtNum(safeMargin, 0)}%)</p>
                </div>

                {product && (
                  <div className="mt-3 text-[13px] flex items-center justify-between">
                    <span className="text-slate-500">Prix actuel du produit</span>
                    <span className="font-medium">
                      {fmtEUR(currentPrice)} {currentMarginPct != null && <span className="text-slate-400">({fmtNum(currentMarginPct, 0)}% marge)</span>}
                    </span>
                  </div>
                )}

                <div className="mt-3 flex items-center gap-2 flex-wrap">
                  <Btn onClick={applyPrice} disabled={!product}><CheckCircle2 size={14} /> Appliquer ce prix au produit</Btn>
                  {applied && <span className="text-[12px] flex items-center gap-1" style={{ color: SAGE }}><CheckCircle2 size={13} /> Prix mis à jour</span>}
                </div>
              </div>
            </div>
          </>
        )}
      </Card>

      <Card title="Vue d'ensemble — tous les produits" icon={BarChart3}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
                <th className="pb-2 font-medium">Produit</th>
                <th className="pb-2 font-medium">Coût matières</th>
                <th className="pb-2 font-medium">Emballage + MO</th>
                <th className="pb-2 font-medium">Coût total</th>
                <th className="pb-2 font-medium">Prix actuel</th>
                <th className="pb-2 font-medium">Marge actuelle</th>
              </tr>
            </thead>
            <tbody>
              {db.products.map((p) => {
                const r = db.recipes.find((rr) => rr.id === p.recipeId);
                const mCost = r ? recipeUnitCost(r, db.rawMaterials) : 0;
                const other = (r?.packagingCost ?? 0) + ((r?.laborMinutes ?? 0) / 60) * hourlyRate;
                const total = mCost + other;
                const marge = p.pricePublic - total;
                const margePct = p.pricePublic > 0 ? (marge / p.pricePublic) * 100 : 0;
                return (
                  <tr key={p.id} className="border-b border-slate-50">
                    <td className="py-2">
                      <button className="text-left hover:underline" style={{ color: r && r.id === recipeId ? TEAL : INK }} onClick={() => r && setRecipeId(r.id)}>{p.name}</button>
                    </td>
                    <td className="py-2 text-slate-500">{fmtEUR(mCost)}</td>
                    <td className="py-2 text-slate-500">{fmtEUR(other)}</td>
                    <td className="py-2">{fmtEUR(total)}</td>
                    <td className="py-2 font-medium">{fmtEUR(p.pricePublic)}</td>
                    <td className="py-2" style={{ color: marge >= 0 ? SAGE : BRICK }}>{fmtNum(margePct, 0)}%</td>
                  </tr>
                );
              })}
              {db.products.length === 0 && <tr><td colSpan={6} className="py-4 text-slate-400 text-center">Aucun produit référencé pour le moment.</td></tr>}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function Production({ db, setDb, logMovement }) {
  const [section, setSection] = useState("of");
  return (
    <div className="space-y-5">
      <div className="flex gap-2 flex-wrap">
        {[{ id: "of", label: "Ordre de fabrication" }, { id: "lots", label: "Historique des lots" }].map((s) => (
          <button key={s.id} onClick={() => setSection(s.id)} className="px-3 py-1.5 rounded-full text-sm"
            style={section === s.id ? { background: TEAL, color: "white" } : { background: "white", color: "#64748B", border: "1px solid #E2E8F0" }}>
            {s.label}
          </button>
        ))}
      </div>
      {section === "of" && <ProductionOrderForm db={db} setDb={setDb} logMovement={logMovement} />}
      {section === "lots" && <BatchHistory db={db} setDb={setDb} logMovement={logMovement} />}
    </div>

}

function ProductionOrderForm({ db, setDb, logMovement }) {
  const [recipeId, setRecipeId] = useState(db.recipes[0]?.id || "");
  const [qty, setQty] = useState(10);
  const [temp, setTemp] = useState(25);
  const [humidity, setHumidity] = useState(65);
  const [cureTime, setCureTime] = useState("24h");
  const [error, setError] = useState("");

  const recipe = db.recipes.find((r) => r.id === recipeId);
  const yieldFactor = recipe ? (recipe.yieldPct > 0 ? recipe.yieldPct : 100) / 100 : 1;
  const needs = recipe
    ? recipe.items.map((it) => {
        const m = db.rawMaterials.find((mm) => mm.id === it.materialId);
        return { material: m, needed: (it.qty * Number(qty || 0)) / yieldFactor };
      })
    : [];

  const launch = () => {
    if (!recipe) { setError("Créez d'abord une recette dans l'onglet Recettes."); return; }
    if (!isPositiveNumber(qty)) { setError("La quantité à produire doit être un nombre supérieur à 0."); return; }
    const shortfalls = needs.filter((n) => n.material && n.needed > n.material.stockQuantity);
    if (shortfalls.length > 0) { setError("Stock insuffisant : " + shortfalls.map((s) => s.material.name).join(", ")); return; }
    setError("");
    const batchNumber = nextBatchNumber(recipe.name, db.batches);

    setDb((prev) => {
      const rawMaterials = prev.rawMaterials.map((m) => {
        const need = needs.find((n) => n.material?.id === m.id);
        return need ? { ...m, stockQuantity: m.stockQuantity - need.needed } : m;
      });
      let products = [...prev.products];
      let product = products.find((p) => p.recipeId === recipe.id);
      if (product) {
        products = products.map((p) => (p.id === product.id ? { ...p, stockQuantity: p.stockQuantity + Number(qty) } : p));
      } else {
        product = { id: uid(), sku: nextSku(products), recipeId: recipe.id, name: recipe.name, pricePublic: 0, alertThreshold: 5, stockQuantity: Number(qty) };
        products.push(product);
      }
      const batch = {
        batchNumber, date: todayISO(), recipeId: recipe.id, productId: product.id, quantityProduced: Number(qty), quantityRemaining: Number(qty),
        ambientTemperature: Number(temp), ambientHumidity: Number(humidity), cureTime, status: "En Cure",
      };
      return { ...prev, rawMaterials, products, batches: [batch, ...prev.batches] };
    });
    logMovement("Production", `Lot ${batchNumber} lancé — ${qty} × ${recipe.name}`);
  };

  return (
    <Card title="Lancer un ordre de fabrication" icon={Factory}>
      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        <Field label="Recette">
          <select className={inputCls} value={recipeId} onChange={(e) => setRecipeId(e.target.value)}>
            {db.recipes.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
          </select>
        </Field>
        <Field label="Quantité à produire"><input type="number" className={inputCls} value={qty} onChange={(e) => setQty(e.target.value)} /></Field>
        <Field label="Température (°C)"><input type="number" className={inputCls} value={temp} onChange={(e) => setTemp(e.target.value)} /></Field>
        <Field label="Humidité (%)"><input type="number" className={inputCls} value={humidity} onChange={(e) => setHumidity(e.target.value)} /></Field>
        <Field label="Temps de cure"><input className={inputCls} value={cureTime} onChange={(e) => setCureTime(e.target.value)} /></Field>
      </div>

      {recipe && (
        <div className="mt-4 rounded-md bg-slate-50 p-3">
          <p className="text-[13px] text-slate-500 mb-2">Matières nécessaires (rendement {recipe.yieldPct || 100}% inclus) :</p>
          <ul className="text-sm space-y-1">
            {needs.map((n, i) => (
              <li key={i} className="flex justify-between gap-2">
                <span className={n.material && n.needed > n.material.stockQuantity ? "text-[#9A3F2E]" : "text-slate-600"}>{n.material?.name || "?"}</span>
                <span className="text-right">{fmtNum(n.needed)} {n.material?.unit} <span className="text-slate-400">/ dispo {fmtNum(n.material?.stockQuantity || 0)}</span></span>
              </li>

          </ul>

      {error && <p className="text-sm text-[#9A3F2E] mt-2">{error}</p>}
      <Btn onClick={launch} disabled={!recipe} size="md"><Plus size={15} /> Valider et générer le lot</Btn>
    </Card>
  );
}
