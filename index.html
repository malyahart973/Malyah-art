/* --------------------------------- Caisse ----------------------------- */

/* Alloue une quantité vendue sur les lots conformes disponibles, du plus
   ancien au plus récent (FIFO), en répartissant sur plusieurs lots si
   nécessaire — pour garder une caisse tactile rapide (on choisit un
   produit, pas un lot) sans perdre la traçabilité lot par lot. */
function allocateBatches(db, productId, qty) {
  const batches = db.batches
    .filter((b) => b.productId === productId && b.status === "Conforme" && b.quantityRemaining > 0)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const allocations = [];
  let remaining = qty;
  for (const b of batches) {
    if (remaining <= 0) break;
    const take = Math.min(b.quantityRemaining, remaining);
    allocations.push({ batchNumber: b.batchNumber, qty: take });
    remaining -= take;
  }
  return { allocations, fulfilled: remaining <= 0, shortfall: remaining };
}
function totalAvailableStock(db, productId) {
  return db.batches.filter((b) => b.productId === productId && b.status === "Conforme" && b.quantityRemaining > 0)
    .reduce((s, b) => s + b.quantityRemaining, 0);
}

function Caisse({ db, setDb, logMovement }) {
  const [client, setClient] = useState("");
  const [channel, setChannel] = useState(CHANNELS[0]);
  const [payment, setPayment] = useState(PAYMENTS[0]);
  const [destinationId, setDestinationId] = useState("local");
  const [cart, setCart] = useState([]); // [{ productId, qty }]
  const [error, setError] = useState("");
  const [receiptOrder, setReceiptOrder] = useState(null);
  const [salesQuery, setSalesQuery] = useState("");
  const filteredSales = db.sales.filter((o) => {
    const q = salesQuery.trim().toLowerCase();
    if (!q) return true;
    return o.clientName.toLowerCase().includes(q) || o.channel.toLowerCase().includes(q) || o.payment.toLowerCase().includes(q);
  });

  const stockFor = (productId) => totalAvailableStock(db, productId);

  const addToCart = (productId) => {
    setError("");
    setCart((prev) => {
      const available = stockFor(productId);
      if (available <= 0) return prev;
      const existing = prev.find((c) => c.productId === productId);
      if (existing) {
        if (existing.qty >= available) return prev;
        return prev.map((c) => (c.productId === productId ? { ...c, qty: c.qty + 1 } : c));
      }
      return [...prev, { productId, qty: 1 }];
    });
  };
  const changeQty = (productId, delta) => {
    setCart((prev) => prev.map((c) => (c.productId === productId ? { ...c, qty: Math.max(1, Math.min(stockFor(productId), c.qty + delta)) } : c)));
  };
  const removeFromCart = (productId) => setCart((prev) => prev.filter((c) => c.productId !== productId));

  const destination = DESTINATIONS.find((d) => d.id === destinationId);
  const cartWithAllocations = cart.map((c) => ({ ...c, ...allocateBatches(db, c.productId, c.qty) }));
  const totalHT = cart.reduce((sum, c) => {
    const p = db.products.find((pp) => pp.id === c.productId);
    return sum + (p ? p.pricePublic * c.qty : 0);
  }, 0);

  const submit = () => {
    if (!client.trim()) { setError("Merci d'indiquer le nom du client."); return; }
    if (cart.length === 0) { setError("Ajoutez au moins un article au panier."); return; }
    const insufficient = cartWithAllocations.filter((c) => !c.fulfilled);
    if (insufficient.length > 0) {
      const names = insufficient.map((c) => db.products.find((p) => p.id === c.productId)?.name).join(", ");
      setError(`Stock insuffisant pour : ${names}`);
      return;
    }
    setError("");

    const items = [];
    cartWithAllocations.forEach((c) => {
      const p = db.products.find((pp) => pp.id === c.productId);
      c.allocations.forEach((a) => {
        items.push({ productId: c.productId, name: p?.name || "", batchNumber: a.batchNumber, qty: a.qty, unitPrice: p?.pricePublic || 0 });
      });
    });

    const order = { orderId: uid(), date: todayISO(), clientName: client.trim(), channel, payment, destinationId, shippingCost: destination?.cost || 0, items };

    setDb((prev) => ({
      ...prev,
      products: prev.products.map((p) => {
        const lineQty = items.filter((it) => it.productId === p.id).reduce((s, it) => s + it.qty, 0);
        return lineQty ? { ...p, stockQuantity: p.stockQuantity - lineQty } : p;
      }),
      batches: prev.batches.map((b) => {
        const lineQty = items.filter((it) => it.batchNumber === b.batchNumber).reduce((s, it) => s + it.qty, 0);
        return lineQty ? { ...b, quantityRemaining: b.quantityRemaining - lineQty } : b;
      }),
      sales: [order, ...prev.sales],
    }));
    logMovement("Vente", `Commande ${client.trim()} — ${fmtEUR(totalHT + (destination?.cost || 0))}`);
    setClient(""); setCart([]); setReceiptOrder(order);
  };

  return (
    <div className="space-y-5">
      <Card title="Nouvelle vente" icon={ShoppingCart}>
        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          <Field label="Client">
            <input className={inputCls} list="clients-datalist" value={client} onChange={(e) => setClient(e.target.value)} />
            <datalist id="clients-datalist">{db.clients.map((c) => <option key={c.id} value={c.name} />)}</datalist>
          </Field>
          <Field label="Canal de vente">
            <select className={inputCls} value={channel} onChange={(e) => setChannel(e.target.value)}>{CHANNELS.map((c) => <option key={c}>{c}</option>)}</select>
          </Field>
          <Field label="Moyen de paiement">
            <select className={inputCls} value={payment} onChange={(e) => setPayment(e.target.value)}>{PAYMENTS.map((p) => <option key={p}>{p}</option>)}</select>
          </Field>
          <Field label="Frais de livraison">
            <select className={inputCls} value={destinationId} onChange={(e) => setDestinationId(e.target.value)}>
              {DESTINATIONS.map((d) => <option key={d.id} value={d.id}>{d.label} {d.cost > 0 ? `(${fmtEUR(d.cost)})` : ""}</option>)}
            </select>
          </Field>
        </div>

        {db.products.length === 0 ? (
          <p className="text-sm text-slate-400">Créez d'abord un produit dans l'onglet Produits.</p>
        ) : (
          <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
            <div className="lg:col-span-3">
              <p className="text-[12px] text-slate-400 mb-2">Touchez un produit pour l'ajouter au panier</p>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {db.products.map((p) => {
                  const stock = stockFor(p.id);
                  const inCart = cart.find((c) => c.productId === p.id);
                  return (
                    <button key={p.id} onClick={() => addToCart(p.id)} disabled={stock <= 0}
                      className="text-left rounded-lg border p-3 relative transition-colors"
                      style={{
                        borderColor: inCart ? TEAL : "#E2E8F0",
                        background: stock <= 0 ? "#F8FAFC" : inCart ? "#EAF7FA" : "white",
                        opacity: stock <= 0 ? 0.5 : 1,
                        cursor: stock <= 0 ? "not-allowed" : "pointer",
                      }}>
                      {inCart && <span className="absolute top-2 right-2 rounded-full text-white text-[11px] w-5 h-5 flex items-center justify-center shrink-0" style={{ background: TEAL }}>{inCart.qty}</span>}
                      <p className="text-[13px] font-medium text-slate-700 pr-6 leading-tight">{p.name}</p>
                      <p className="text-[12px] text-slate-400 mt-1">{fmtEUR(p.pricePublic)}</p>
                      <p className="text-[11px] mt-0.5" style={{ color: stock <= 0 ? BRICK : "#94A3B8" }}>{stock <= 0 ? "Rupture" : `${stock} dispo`}</p>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="lg:col-span-2">
              <p className="text-[12px] text-slate-400 mb-2">Panier</p>
              <div className="border border-slate-200 rounded-lg divide-y divide-slate-50 max-h-[420px] overflow-y-auto">
                {cart.length === 0 ? (
                  <p className="text-sm text-slate-400 p-4">Panier vide.</p>
                ) : cartWithAllocations.map((c) => {
                  const p = db.products.find((pp) => pp.id === c.productId);
                  return (
                    <div key={c.productId} className="p-2.5">
                      <div className="flex items-center justify-between gap-2">
                        <p className="text-[13px] font-medium text-slate-700 truncate">{p?.name}</p>
                        <button onClick={() => removeFromCart(c.productId)} className="text-slate-300 hover:text-[#9A3F2E] shrink-0"><Trash2 size={13} /></button>
                      </div>
                      <div className="flex items-center justify-between mt-1.5">
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => changeQty(c.productId, -1)} className="w-6 h-6 rounded-md border border-slate-200 flex items-center justify-center text-slate-500">−</button>
                          <span className="text-sm w-6 text-center">{c.qty}</span>
                          <button onClick={() => changeQty(c.productId, 1)} disabled={c.qty >= stockFor(c.productId)} className="w-6 h-6 rounded-md border border-slate-200 flex items-center justify-center text-slate-500 disabled:opacity-30">+</button>
                        </div>
                        <span className="text-sm font-medium">{fmtEUR((p?.pricePublic || 0) * c.qty)}</span>
                      </div>
                      <p className="text-[11px] mt-1 truncate" style={{ color: c.fulfilled ? "#94A3B8" : BRICK }}>
                        {c.allocations.map((a) => `${a.batchNumber} (×${a.qty})`).join(", ")}
                        {!c.fulfilled && ` — manque ${c.shortfall}`}
                      </p>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        <div className="flex justify-between items-center mt-4 pt-3 border-t border-slate-100 text-sm flex-wrap gap-2">
          <div className="text-slate-500">Sous-total {fmtEUR(totalHT)} + fret {fmtEUR(destination?.cost || 0)}</div>
          <div className="font-display text-lg" style={{ color: INK }}>{fmtEUR(totalHT + (destination?.cost || 0))}</div>
        </div>
        <ErrorText>{error}</ErrorText>
        <div className="mt-2"><Btn onClick={submit} size="md"><CheckCircle2 size={15} /> Encaisser la vente</Btn></div>
      </Card>

      {receiptOrder && <Receipt db={db} order={receiptOrder} onClose={() => setReceiptOrder(null)} />}

      <Card title="Historique des ventes" icon={ShoppingCart}>
        <TableSearch value={salesQuery} onChange={setSalesQuery} placeholder="Rechercher un client, un canal…" />
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
                <th className="pb-2 font-medium">Date</th><th className="pb-2 font-medium">Client</th><th className="pb-2 font-medium">Canal</th>
                <th className="pb-2 font-medium">Total</th><th className="pb-2 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              {filteredSales.map((o) => {
                const total = o.items.reduce((s, it) => s + it.qty * it.unitPrice, 0) + o.shippingCost;
                return (
                  <tr key={o.orderId} className="border-b border-slate-50">
                    <td className="py-2.5">{o.date}</td><td className="py-2.5">{o.clientName}</td>
                    <td className="py-2.5"><Badge>{o.channel}</Badge></td>
                    <td className="py-2.5 font-medium text-slate-700">{fmtEUR(total)}</td>
                    <td className="py-2.5 text-right"><Btn size="sm" variant="ghost" onClick={() => setReceiptOrder(o)}>Reçu</Btn></td>
                  </tr>
                );
              })}
              {filteredSales.length === 0 && (
                <tr><td colSpan={5} className="py-4 text-slate-400 text-center">{db.sales.length === 0 ? "Aucune vente enregistrée." : "Aucun résultat pour cette recherche."}</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

  const total = order.items.reduce((s, it) => s + it.qty * it.unitPrice, 0) + order.shippingCost;
  const w = db.workshop;
  return (
    <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-30 p-4">
      <div className="bg-white rounded-lg max-w-sm w-full p-6 relative max-h-[90vh] overflow-y-auto">
        <button onClick={onClose} className="absolute top-3 right-3 text-slate-300"><X size={16} /></button>
        <div id="print-receipt-area">
          <div className="flex items-center gap-2 mb-2">
            <img src={LOGO_SRC} alt="Malyah Art" className="object-contain" style={{ height: 32, width: "auto" }} />
            <p className="font-display text-lg" style={{ color: INK }}>{w.name}</p>
          </div>
          <p className="text-[11px] text-slate-400 mb-3">{w.address} {w.siret ? `· SIRET ${w.siret}` : ""}</p>
          <p className="text-sm">Client : {order.clientName}</p>
          <p className="text-sm mb-3">Date : {order.date} · {order.payment}</p>
          <div className="border-t border-b border-slate-100 py-2 space-y-1">
            {order.items.map((it, i) => (
              <div key={i} className="flex justify-between text-sm">
                <span>{it.qty} × {it.name} <span className="text-slate-400 text-[11px]">({it.batchNumber})</span></span>
                <span>{fmtEUR(it.qty * it.unitPrice)}</span>
              </div>
            ))}
            {order.shippingCost > 0 && <div className="flex justify-between text-sm text-slate-500"><span>Fret / livraison</span><span>{fmtEUR(order.shippingCost)}</span></div>}
          </div>
          <div className="flex justify-between mt-2 font-medium"><span>Total</span><span>{fmtEUR(total)}</span></div>
          <p className="text-[10px] text-slate-400 mt-3">{w.email} {w.phone ? `· ${w.phone}` : ""}</p>
          {w.footerNote && <p className="text-[10px] text-slate-400 mt-1 italic">{w.footerNote}</p>}
        </div>
        <Btn onClick={() => window.print()} size="sm" variant="ghost"><Printer size={14} /> Imprimer</Btn>
      </div>
    </div>
  );
}

function TraceabilitySheet({ db, batch, onClose }) {
  const product = db.products.find((p) => p.id === batch.productId);
  const recipe = db.recipes.find((r) => r.id === batch.recipeId);
  const hazard = recipe && db.fragranceHazards[recipe.fragrance];
  const w = db.workshop;
  const yieldFactor = recipe ? (recipe.yieldPct > 0 ? recipe.yieldPct : 100) / 100 : 1;
  const consumption = recipe
    ? recipe.items.map((it) => {
        const m = db.rawMaterials.find((mm) => mm.id === it.materialId);
        return { material: m, qty: (it.qty * batch.quantityProduced) / yieldFactor };
      })
    : [];
  const sales = db.sales.filter((o) => o.items.some((it) => it.batchNumber === batch.batchNumber))
    .map((o) => ({ order: o, item: o.items.find((it) => it.batchNumber === batch.batchNumber) }));
  const sold = batch.quantityProduced - batch.quantityRemaining;

  return (
    <div className="fixed inset-0 bg-black/40 flex items-start sm:items-center justify-center z-30 p-3 sm:p-6 overflow-y-auto">

              <img src={LOGO_SRC} alt="logo" className="object-contain" style={{ height: 50, width: "auto" }} />
              <div>
                <p className="font-display text-lg" style={{ color: INK }}>{w.name}</p>
                <p className="text-[12px] text-slate-500">{w.address}</p>
                <p className="text-[12px] text-slate-500">{w.siret ? `SIRET ${w.siret}` : ""} {w.email ? `· ${w.email}` : ""} {w.phone ? `· ${w.phone}` : ""}</p>

              {hazard.hPhrases.map((h, i) => <p key={i} className="text-[12px] text-slate-600">{h}</p>)}
              <p className="text-[12px] text-slate-600 mt-1">Contient : {hazard.allergens.map((a) => `${a.name} (${a.pct}%)`).join(", ")}</p>
            </div>
          ) : <p className="text-[12px] text-slate-400 mb-5">Aucune substance à risque associée à cette recette.</p>}

          <p className="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">Traçabilité des ventes — Lot → Produit → Ventes</p>
          <table className="w-full text-[12.5px] mb-6 border-collapse">
            <thead>
              <tr className="text-left border-b border-slate-200">
                <th className="py-1.5 font-medium text-slate-500">Date</th>
                <th className="py-1.5 font-medium text-slate-500">Client</th>
                <th className="py-1.5 font-medium text-slate-500">Canal</th>
                <th className="py-1.5 font-medium text-slate-500 text-right">Quantité</th>
              </tr>
            </thead>

              {sales.map(({ order, item }, i) => (
                <tr key={i} className="border-b border-slate-50">
                  <td className="py-1.5">{order.date}</td>
                  <td className="py-1.5">{order.clientName}</td>
                  <td className="py-1.5 text-slate-500">{order.channel}</td>
                  <td className="py-1.5 text-right">{item.qty}</td>
                </tr>
              ))}
              {sales.length === 0 && <tr><td colSpan={4} className="py-2 text-slate-400">Aucune vente enregistrée sur ce lot à ce jour.</td></tr>}
            </tbody>
          </table>

          <div className="flex items-end justify-between border-t border-slate-200 pt-3">
            <p className="text-[11px] text-slate-400 max-w-xs">{w.footerNote}</p>
            <div className="text-[11px] text-slate-400 text-right">
              <p>Document généré automatiquement — Malyah Art</p>
              <p>Responsable qualité : _______________________</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Tracabilite({ db, initialBatch }) {
  const [mode, setMode] = useState(initialBatch ? "lot" : "produit");
  const [selectedId, setSelectedId] = useState(db.products[0]?.id || "");
  const [selectedBatch, setSelectedBatch] = useState(initialBatch && db.batches.some((b) => b.batchNumber === initialBatch) ? initialBatch : (db.batches[0]?.batchNumber || ""));
  const [sheetBatch, setSheetBatch] = useState(null);

  useEffect(() => {
    if (initialBatch && db.batches.some((b) => b.batchNumber === initialBatch)) {
      setMode("lot");
      setSelectedBatch(initialBatch);
    }
  }, [initialBatch]);

  const salesForBatch = (batchNumber) => db.sales.filter((o) => o.items.some((it) => it.batchNumber === batchNumber))
    .map((o) => ({ order: o, item: o.items.find((it) => it.batchNumber === batchNumber) }));

  return (
    <div className="space-y-5">
      <div className="flex gap-2">
        {[{ id: "produit", label: "Produit → Lot → Vente" }, { id: "lot", label: "Lot → Produit → Ventes" }].map((m) => (
          <button key={m.id} onClick={() => setMode(m.id)} className="px-3 py-1.5 rounded-full text-sm"
            style={mode === m.id ? { background: TEAL, color: "white" } : { background: "white", color: "#64748B", border: "1px solid #E2E8F0" }}>
            {m.label}
          </button>
        ))}
      </div>

      {mode === "produit" ? (
        <Card title="Depuis un produit" icon={GitBranch}>
          <Field label="Produit">
            <select className={inputCls} value={selectedId} onChange={(e) => setSelectedId(e.target.value)}>
              {db.products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <div className="mt-4 space-y-4">
            {db.batches.filter((b) => b.productId === selectedId).map((b) => (
              <div key={b.batchNumber} className="rounded-md border border-slate-100 p-3">

                    <ArrowRight size={13} className="text-slate-300" /> {b.batchNumber} <Badge tone={b.status === "Conforme" ? "ok" : "neutral"}>{b.status}</Badge>
                  </div>
                  <button onClick={() => setSheetBatch(b)} className="text-[12px] flex items-center gap-1" style={{ color: TEAL }}><FileText size={13} /> Fiche A4</button>
                </div>
                <div className="mt-2 pl-5 space-y-1">
                  {salesForBatch(b.batchNumber).length === 0 ? (
                    <p className="text-[12px] text-slate-400">Aucune vente sur ce lot.</p>
                  ) : salesForBatch(b.batchNumber).map(({ order, item }, i) => (
                    <div key={i} className="flex items-center gap-2 text-[13px] text-slate-500">
                      <ArrowRight size={12} className="text-slate-300" /> {order.date} · {order.clientName} · {item.qty} unité(s)
                    </div>
                  ))}
                </div>
              </div>
            ))}
            {db.batches.filter((b) => b.productId === selectedId).length === 0 && <p className="text-sm text-slate-400">Aucun lot produit pour ce produit.</p>}
          </div>
        </Card>
      ) : (
        <Card title="Depuis un lot" icon={GitBranch}>
          <div className="flex flex-wrap items-end gap-3">
            <Field label="Numéro de lot">
              <select className={inputCls} value={selectedBatch} onChange={(e) => setSelectedBatch(e.target.value)}>
                {db.batches.map((b) => <option key={b.batchNumber} value={b.batchNumber}>{b.batchNumber}</option>)}
              </select>
            </Field>
            {selectedBatch && (
              <Btn variant="ghost" size="sm" onClick={() => setSheetBatch(db.batches.find((b) => b.batchNumber === selectedBatch))}>
                <FileText size={14} /> Fiche de traçabilité complète (A4)
              </Btn>
            )}
          </div>
          {db.batches.length === 0 ? (
            <p className="text-sm text-slate-400 mt-4">Aucun lot produit pour le moment — lancez une production dans l'onglet Production.</p>
          ) : (() => {
            const batch = db.batches.find((b) => b.batchNumber === selectedBatch);
            const product = db.products.find((p) => p.id === batch?.productId);
            return (
              <div className="mt-4 space-y-3">
                <div className="flex items-center gap-2 text-sm">
                  <ArrowRight size={13} className="text-slate-300" /> <span className="font-medium text-slate-700">{product?.name}</span>
                  <span className="text-slate-400">({batch?.quantityRemaining}/{batch?.quantityProduced} restants)</span>

                    <p className="text-[12px] text-slate-400">Aucune vente sur ce lot.</p>

                    <div key={i} className="flex items-center gap-2 text-[13px] text-slate-500">
                      <ArrowRight size={12} className="text-slate-300" /> {order.date} · {order.clientName} · {item.qty} unité(s) · {order.channel}
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </Card>
      )}

      {sheetBatch && <TraceabilitySheet db={db} batch={sheetBatch} onClose={() => setSheetBatch(null)} />}
    </div>
  );
}

const LABEL_SIZES = [
  { id: "30x50", label: "30 × 50 mm — bijoux, petits objets", w: 30, h: 50 },
  { id: "40x60", label: "40 × 60 mm — petits contenants", w: 40, h: 60 },
  { id: "50x70", label: "50 × 70 mm — format standard", w: 50, h: 70 },
  { id: "60x90", label: "60 × 90 mm — bougies, coffrets", w: 60, h: 90 },
  { id: "100x150", label: "100 × 150 mm — cartons, envois", w: 100, h: 150 },
  { id: "custom", label: "Personnalisé…", w: null, h: null },
];

function Etiquettes({ db }) {
  const [batchNumber, setBatchNumber] = useState(db.batches[0]?.batchNumber || "");
  const [qrMode, setQrMode] = useState("text");
  const [sizeId, setSizeId] = useState("50x70");
  const [customW, setCustomW] = useState(50);
  const [customH, setCustomH] = useState(70);
  const batch = db.batches.find((b) => b.batchNumber === batchNumber);
  const product = batch && db.products.find((p) => p.id === batch.productId);
  const recipe = batch && db.recipes.find((r) => r.id === batch.recipeId);
  const hazard = recipe && db.fragranceHazards[recipe.fragrance];
  const w = db.workshop;

  const preset = LABEL_SIZES.find((s) => s.id === sizeId);
  const labelW = preset.w ?? clampNonNegative(customW, 50) || 50;
  const labelH = preset.h ?? clampNonNegative(customH, 70) || 70;

  /* Mise en forme adaptative : l'échelle typographique suit la surface de
     l'étiquette (référence 50×70mm = échelle 1), et les blocs les moins
     essentiels se masquent sous un seuil de largeur pour rester lisibles. */
  const scale = Math.min(2.1, Math.max(0.55, Math.sqrt((labelW * labelH) / (50 * 70))));
  const fz = (base) => `${(base * scale).toFixed(2)}px`;
  const showHazardText = labelW >= 38;
  const showAddress = labelW >= 38;
  const showAllPictos = labelW >= 34;

  const qrValue = useMemo(() => {
    if (!batch || !product) return "";
    if (qrMode === "link") {
      try { return `${window.location.origin}${window.location.pathname}?lot=${encodeURIComponent(batch.batchNumber)}`; } catch (e) { return batch.batchNumber; }
    }
    const lines = [
      w.name || "Malyah Art",
      `Produit : ${product.name} (SKU ${product.sku})`,
      `Lot : ${batch.batchNumber}`,
      `Fabrication : ${batch.date} — Cure ${batch.cureTime} — Statut ${batch.status}`,
    ];
    if (w.siret) lines.push(`SIRET ${w.siret}`);
    if (w.address) lines.push(w.address);
    return lines.join("\n");
  }, [batch, product, qrMode, w]);

  return (
    <div className="space-y-5">
      <Card title="Générer une étiquette" icon={Tag}>
        <div className="flex flex-wrap gap-3">
          <Field label="Sélectionner un lot">
            <select className={inputCls} value={batchNumber} onChange={(e) => setBatchNumber(e.target.value)}>
              {db.batches.map((b) => <option key={b.batchNumber} value={b.batchNumber}>{b.batchNumber} — {db.products.find((p) => p.id === b.productId)?.name}</option>)}
            </select>
          </Field>
          <Field label="Format de l'étiquette">
            <select className={inputCls} value={sizeId} onChange={(e) => setSizeId(e.target.value)}>
              {LABEL_SIZES.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
          </Field>
          {sizeId === "custom" && (
            <>
              <Field label="Largeur (mm)"><input type="number" min="20" max="200" className={inputCls + " w-24"} value={customW} onChange={(e) => setCustomW(e.target.value)} /></Field>
              <Field label="Hauteur (mm)"><input type="number" min="20" max="300" className={inputCls + " w-24"} value={customH} onChange={(e) => setCustomH(e.target.value)} /></Field>
            </>
          )}
          <Field label="Contenu du QR">
            <div className="flex gap-1.5">
              <button onClick={() => setQrMode("text")} className="px-2.5 py-2 rounded-md text-[12.5px]" style={qrMode === "text" ? { background: TEAL, color: "white" } : { border: "1px solid #E2E8F0", color: "#64748B" }}>Fiche traçabilité (hors-ligne)</button>
              <button onClick={() => setQrMode("link")} className="px-2.5 py-2 rounded-md text-[12.5px]" style={qrMode === "link" ? { background: TEAL, color: "white" } : { border: "1px solid #E2E8F0", color: "#64748B" }}>Lien vers l'appli</button>
            </div>
          </Field>
        </div>
        {!showHazardText && (
          <p className="text-[12px] mt-3" style={{ color: BRICK }}>Format compact : la fiche de sécurité complète (phrases de risque, allergènes) ne tient pas lisiblement sur cette taille — seul le pictogramme d'alerte reste affiché. Utilisez un format ≥ 40×60mm pour l'afficher en toutes lettres.</p>
        )}
      </Card>

      {batch && recipe && product && (
        <div className="flex flex-col md:flex-row gap-5 items-start">
          <div id="print-label-area" className="border-2 rounded-md bg-white flex flex-col overflow-hidden"
            style={{ borderColor: INK, width: `${labelW}mm`, height: `${labelH}mm`, padding: `${Math.max(1.5, labelW * 0.03)}mm` }}>
            <div className="flex items-center" style={{ gap: fz(4) }}>
              <img src={LOGO_SRC} alt="logo" className="object-contain shrink-0" style={{ height: fz(24), width: "auto" }} />
              <p className="font-display leading-none truncate" style={{ color: INK, fontSize: fz(10) }}>{w.name}</p>
            </div>
            <div className="border-t border-slate-200" style={{ margin: `${fz(5)} 0` }} />
            <p className="font-semibold leading-tight" style={{ fontSize: fz(11) }}>{product.name}</p>
            <p className="text-slate-500" style={{ fontSize: fz(9) }}>Poids net : {recipe.netWeight}{recipe.netWeightUnit}</p>
            <p className="text-slate-400 font-mono" style={{ fontSize: fz(8), marginTop: fz(2) }}>Lot {batch.batchNumber}</p>

            <div className="flex items-center" style={{ gap: fz(6), margin: `${fz(6)} 0` }}>
              {hazard && <Pictogram db={db} slotKey="ghs07" size={Number(fz(20).replace("px", ""))} Fallback={PictoGHS07} title="Contient un allergène / substance sensibilisante — pictogramme CLP GHS07" />}
              {showAllPictos && <>
                <Pictogram db={db} slotKey="unattended" size={Number(fz(16).replace("px", ""))} Fallback={PictoUnattended} title="Ne jamais laisser une bougie allumée sans surveillance" />
                <Pictogram db={db} slotKey="children" size={Number(fz(16).replace("px", ""))} Fallback={PictoChildren} title="Tenir hors de portée des enfants et animaux domestiques" />
                <Pictogram db={db} slotKey="burn" size={Number(fz(16).replace("px", ""))} Fallback={PictoBurn} title="Risque de brûlure" />
              </>}
            </div>

            {showHazardText ? (
              hazard ? (
                <div className="text-slate-600 leading-snug" style={{ fontSize: fz(6.5) }}>
                  {hazard.hPhrases.map((h, i) => <p key={i}>{h}</p>)}
                  <p style={{ marginTop: fz(2) }}>Contient : {hazard.allergens.map((a) => `${a.name} (${a.pct}%)`).join(", ")}</p>
                </div>
              ) : <p className="text-slate-400" style={{ fontSize: fz(7) }}>Aucune fiche de sécurité associée.</p>
            ) : hazard && <p className="text-slate-400 italic" style={{ fontSize: fz(6) }}>Voir fiche de sécurité complète.</p>}

            <div className="flex items-end justify-between mt-auto" style={{ paddingTop: fz(4) }}>
              <div style={{ width: fz(96) }}>
                <Barcode39 value={product.sku + traceDigits(batch.batchNumber)} height={Number(fz(22).replace("px", ""))} />
                <p className="font-mono text-slate-400" style={{ fontSize: fz(6) }}>{batch.batchNumber}</p>
              </div>
              <QRCodeSVG value={qrValue} size={Number(fz(38).replace("px", ""))} />
            </div>
            {showAddress && (
              <div className="border-t border-slate-200" style={{ marginTop: fz(4), paddingTop: fz(4) }}>
                <p className="text-slate-500 leading-tight" style={{ fontSize: fz(6.5) }}>{w.address}</p>
                <p className="text-slate-500 leading-tight" style={{ fontSize: fz(6.5) }}>{w.email} {w.phone ? `· ${w.phone}` : ""}</p>
              </div>
            )}
          </div>

          <div className="flex-1 space-y-3 min-w-0">
            <Card title="Impression">
              <p className="text-sm text-slate-500 mb-3">L'étiquette s'imprime au format réel {labelW}×{labelH}mm via la fenêtre d'impression du navigateur (Ctrl/Cmd+P). Compatible imprimante jet d'encre ou thermique reliée en Bluetooth.</p>
              <Btn onClick={() => window.print()}><Printer size={15} /> Imprimer l'étiquette</Btn>
            </Card>
            <Card title="Traçabilité — contrôle DGCCRF" icon={ScanLine}>
              <p className="text-sm text-slate-500">
                Le QR est un vrai QR code scannable. En mode <strong>« Fiche traçabilité »</strong>, il encode directement le produit, le numéro de lot, la date de fabrication et l'identité de l'atelier : lisible par n'importe quel scanner, sans connexion ni accès au compte — idéal pour un contrôle sur place.
                En mode <strong>« Lien vers l'appli »</strong>, il ouvre la fiche de traçabilité du lot dans cette application ; pensez alors à partager la page (bouton de partage de l'artefact) pour qu'un contrôleur externe puisse l'ouvrir.
              </p>
            </Card>
            <Card title="Pictogrammes" icon={AlertTriangle}>
              <p className="text-sm text-slate-500">
                Le losange rouge <PictoGHS07 size={14} /> est le pictogramme CLP officiel « mise en garde » (GHS07), affiché automatiquement dès qu'une phrase de risque (H-phrase) est associée au parfum. Les trois pictogrammes noir et blanc (bougie sans surveillance, enfants, brûlure) sont des vecteurs génériques indicatifs. Pour une impression commerciale en série, importez vos fichiers officiels sous licence dans l'onglet <strong>Atelier → Pictogrammes officiels</strong> : ils remplaceront automatiquement ces icônes sur toutes vos étiquettes.
              </p>
            </Card>
            <Card title="Code-barres">
              <p className="text-sm text-slate-500">
                Le code-barres est encodé en <strong>Code 39</strong> (numérique) plutôt qu'en Code 128, afin de garantir une lecture fiable — la table Code 128 complète est trop dense pour être reproduite sans risque d'erreur ici. Vérifiez toujours vos étiquettes avec un scanner avant impression en série.
              </p>
            </Card>
          </div>
        </div>
      )}
    </div>
  );
}

/* --------------------------------- Achats -------------------------------- */

function Achats({ db, setDb, logMovement }) {
  const [supplierName, setSupplierName] = useState(db.suppliers[0]?.name || "");
  const [date, setDate] = useState(todayISO());
  const [items, setItems] = useState([{ materialId: db.rawMaterials[0]?.id || "", qty: "", unitPrice: "" }]);
  const [error, setError] = useState("");
  const [purchaseQuery, setPurchaseQuery] = useState("");
  const filteredPurchases = db.purchases.filter((p) => {
    const q = purchaseQuery.trim().toLowerCase();
    if (!q) return true;
    if (p.supplierName.toLowerCase().includes(q)) return true;
    return p.items.some((it) => db.rawMaterials.find((m) => m.id === it.materialId)?.name.toLowerCase().includes(q));
  });

  const addRow = () => setItems([...items, { materialId: db.rawMaterials[0]?.id || "", qty: "", unitPrice: "" }]);
  const updateRow = (i, patch) => setItems(items.map((it, idx) => (idx === i ? { ...it, ...patch } : it)));
  const removeRow = (i) => setItems(items.filter((_, idx) => idx !== i));

  const total = items.reduce((s, it) => s + Number(it.qty || 0) * Number(it.unitPrice || 0), 0);

  const submit = () => {
    if (!supplierName) { setError("Merci d'indiquer un fournisseur."); return; }
    if (!date) { setError("Merci d'indiquer une date de commande."); return; }
    const invalidPrice = items.some((it) => it.unitPrice !== "" && Number(it.unitPrice) < 0);
    if (invalidPrice) { setError("Le prix unitaire ne peut pas être négatif."); return; }
    const valid = items.filter((it) => it.materialId && isPositiveNumber(it.qty));
    if (valid.length === 0) { setError("Ajoutez au moins une ligne avec une quantité supérieure à 0."); return; }
    setError("");
    const purchase = {
      id: uid(), date, supplierName, status: "Commandé", receivedDate: null,
      items: valid.map((it) => ({ materialId: it.materialId, qty: Number(it.qty), unitPrice: clampNonNegative(it.unitPrice, 0) })),
    };
    setDb((prev) => ({ ...prev, purchases: [purchase, ...prev.purchases] }));
    logMovement("Achat", `Commande fournisseur ${supplierName} — ${fmtEUR(total)}`);
    setItems([{ materialId: db.rawMaterials[0]?.id || "", qty: "", unitPrice: "" }]);
  };

  const markReceived = (purchaseId) => {
    const purchase = db.purchases.find((p) => p.id === purchaseId);
    if (!purchase || purchase.status === "Reçu") return;
    setDb((prev) => ({
      ...prev,
      rawMaterials: prev.rawMaterials.map((m) => {
        const line = purchase.items.find((it) => it.materialId === m.id);
        if (!line) return m;
        const updated = { ...m, stockQuantity: m.stockQuantity + line.qty };
        if (line.unitPrice > 0 && line.unitPrice !== m.purchasePrice) {
          updated.purchasePrice = line.unitPrice;
          updated.priceHistory = [...(m.priceHistory || [{ date: todayISO(), price: m.purchasePrice }]), { date: todayISO(), price: line.unitPrice }];
        }
        return updated;
      }),
      purchases: prev.purchases.map((p) => (p.id === purchaseId ? { ...p, status: "Reçu", receivedDate: todayISO() } : p)),
    }));
    logMovement("Achat", `Réception fournisseur ${purchase.supplierName} — lot de matières ajouté au stock`);
  };

  return (
    <div className="space-y-5">
      <Card title="Nouvel achat" icon={PackagePlus}>
        {db.suppliers.length === 0 && <p className="text-sm text-slate-400 mb-3">Ajoutez d'abord un fournisseur dans l'onglet Fournisseurs.</p>}
        {db.rawMaterials.length === 0 && <p className="text-sm text-slate-400 mb-3">Ajoutez d'abord une matière première dans l'onglet Matières premières.</p>}
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Field label="Fournisseur">
            <select className={inputCls} value={supplierName} onChange={(e) => setSupplierName(e.target.value)}>
              {db.suppliers.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          </Field>
          <Field label="Date de commande"><input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        </div>

        <div className="mt-4 space-y-2">
          {items.map((it, i) => (
            <div key={i} className="flex gap-2 items-center flex-wrap border-b border-slate-50 pb-2">
              <select className={inputCls + " flex-1 min-w-[160px]"} value={it.materialId} onChange={(e) => updateRow(i, { materialId: e.target.value })}>
                {db.rawMaterials.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
              <input type="number" placeholder="Quantité" className={inputCls + " w-28"} value={it.qty} onChange={(e) => updateRow(i, { qty: e.target.value })} />
              <input type="number" placeholder="Prix unitaire €" className={inputCls + " w-32"} value={it.unitPrice} onChange={(e) => updateRow(i, { unitPrice: e.target.value })} />
              <button onClick={() => removeRow(i)} className="text-slate-300 hover:text-[#9A3F2E]"><Trash2 size={16} /></button>
            </div>
          ))}
        </div>
        <div className="mt-2 flex items-center justify-between flex-wrap gap-2">
          <Btn variant="ghost" size="sm" onClick={addRow}><Plus size={13} /> Ajouter une ligne</Btn>

function Clients({ db, setDb }) {
  const blank = { name: "", type: CHANNELS[0], email: "", phone: "", address: "", notes: "" };
  const [form, setForm] = useState(blank);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState("");

  const startAdd = () => { setForm(blank); setEditingId(null); setShowForm(true); setError(""); };
  const startEdit = (c) => { setForm({ name: c.name, type: c.type, email: c.email, phone: c.phone, address: c.address, notes: c.notes }); setEditingId(c.id); setShowForm(true); setError(""); };

  const save = () => {
    if (!form.name.trim()) { setError("Le nom du client est obligatoire."); return; }
    if (!isValidEmail(form.email)) { setError("L'adresse e-mail n'est pas valide."); return; }
    if (db.clients.some((c) => c.id !== editingId && c.name.trim().toLowerCase() === form.name.trim().toLowerCase())) { setError("Un client porte déjà ce nom."); return; }
    setError("");
    const cleanForm = { ...form, name: form.name.trim() };
    if (editingId) {
      const previous = db.clients.find((c) => c.id === editingId);
      const renamed = previous && previous.name !== cleanForm.name;
      setDb((prev) => ({
        ...prev,
        clients: prev.clients.map((c) => (c.id === editingId ? { ...c, ...cleanForm } : c)),
        sales: renamed ? prev.sales.map((o) => (o.clientName === previous.name ? { ...o, clientName: cleanForm.name } : o)) : prev.sales,
      }));
    } else {
      setDb((prev) => ({ ...prev, clients: [...prev.clients, { id: uid(), ...cleanForm }] }));
    }
    setForm(blank); setEditingId(null); setShowForm(false);
  };
  const remove = (id) => setDb((prev) => ({ ...prev, clients: prev.clients.filter((c) => c.id !== id) }));

  const statsFor = (name) => {
    const orders = db.sales.filter((o) => o.clientName === name);
    const ca = orders.reduce((s, o) => s + o.items.reduce((ss, it) => ss + it.qty * it.unitPrice, 0) + o.shippingCost, 0);
    const lastOrder = orders.length ? [...orders].sort((a, b) => (a.date < b.date ? 1 : -1))[0].date : null;
    return { orders: orders.length, ca, lastOrder };
  };

  return (
    <div className="space-y-5">
      <Card title="Répertoire clients" icon={Users} right={<Btn size="sm" onClick={showForm && !editingId ? () => setShowForm(false) : startAdd}><Plus size={13} /> Nouveau client</Btn>}>

            <Field label="Type">
              <select className={inputCls} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{CHANNELS.map((c) => <option key={c}>{c}</option>)}</select>
            </Field>
            <Field label="Email"><input className={inputCls} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
            <Field label="Téléphone"><input className={inputCls} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} /></Field>
            <Field label="Adresse"><input className={inputCls} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} /></Field>
            <Field label="Notes"><input className={inputCls} value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
            <div className="sm:col-span-2 md:col-span-3">
              <ErrorText>{error}</ErrorText>
              <div className="flex gap-2 mt-2">
                <Btn size="sm" onClick={save}>{editingId ? "Enregistrer les modifications" : "Enregistrer le client"}</Btn>
                <Btn size="sm" variant="ghost" onClick={() => { setShowForm(false); setEditingId(null); setError(""); }}>Annuler</Btn>
              </div>
            </div>
          </div>
        )}
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
                <th className="pb-2 font-medium">Client</th><th className="pb-2 font-medium">Contact</th>
                <th className="pb-2 font-medium">Commandes</th><th className="pb-2 font-medium">CA généré</th>
                <th className="pb-2 font-medium">Dernière commande</th><th></th>
              </tr>
            </thead>
            <tbody>
              {db.clients.map((c) => {
                const st = statsFor(c.name);
                return (
                  <tr key={c.id} className="border-b border-slate-50">
                    <td className="py-2.5"><p className="font-medium text-slate-700">{c.name}</p><p className="text-[12px] text-slate-400">{c.type}{c.address ? ` · ${c.address}` : ""}</p></td>
                    <td className="py-2.5 text-slate-500 text-[12.5px]">{c.email}{c.email && c.phone ? " · " : ""}{c.phone}</td>
                    <td className="py-2.5">{st.orders}</td>
                    <td className="py-2.5">{fmtEUR(st.ca)}</td>
                    <td className="py-2.5 text-slate-500">{st.lastOrder || "—"}</td>

/* --------------------------------- Rapports ------------------------------- */

function Rapports({ db }) {
  const report = useMemo(() => {
    const byMonth = {};
    const byProduct = {};
    db.sales.forEach((o) => {
      const key = o.date.slice(0, 7);
      o.items.forEach((it) => {
        const total = it.qty * it.unitPrice;
        byMonth[key] = (byMonth[key] || 0) + total;
        if (!byProduct[it.productId]) byProduct[it.productId] = { name: it.name, qty: 0, ca: 0 };
        byProduct[it.productId].qty += it.qty;
        byProduct[it.productId].ca += total;
      });
    });
    const months = [];
    const d = new Date();
    for (let i = 11; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push({ key: `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`, label: dt.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" }) });
    }
    const topProduits = Object.values(byProduct).sort((a, b) => b.ca - a.ca);

    const margeProduits = db.products.map((p) => {
      const recipe = db.recipes.find((r) => r.id === p.recipeId);
      const cost = recipe ? recipeUnitCost(recipe, db.rawMaterials) : 0;
      const marge = p.pricePublic - cost;
      return { name: p.name, prix: p.pricePublic, cout: cost, marge, margePct: p.pricePublic > 0 ? (marge / p.pricePublic) * 100 : 0 };
    });

    const valeurStockMatieres = db.rawMaterials.reduce((s, m) => s + m.stockQuantity * unitCostGuyane(m), 0);
    const valeurStockProduitsCout = db.products.reduce((s, p) => {
      const recipe = db.recipes.find((r) => r.id === p.recipeId);
      return s + p.stockQuantity * (recipe ? recipeUnitCost(recipe, db.rawMaterials) : 0);
    }, 0);
    const valeurStockProduitsPublic = db.products.reduce((s, p) => s + p.stockQuantity * p.pricePublic, 0);

    const now = todayISO().slice(0, 7);
    const achatsMois = db.purchases.filter((p) => p.date.slice(0, 7) === now)
      .reduce((s, p) => s + p.items.reduce((ss, it) => ss + it.qty * it.unitPrice, 0), 0);

    return { monthLabels: months.map((m) => m.label), monthValues: months.map((m) => byMonth[m.key] || 0), topProduits, margeProduits, valeurStockMatieres, valeurStockProduitsCout, valeurStockProduitsPublic, achatsMois };
  }, [db]);

  const exportMarges = () => {
    const rows = [["Produit", "Prix public", "Coût de revient", "Marge €", "Marge %"]];
    report.margeProduits.forEach((r) => rows.push([r.name, r.prix.toFixed(2), r.cout.toFixed(2), r.marge.toFixed(2), fmtNum(r.margePct, 1)]));
    downloadFile(`malyah-art-marges-${todayISO()}.csv`, "\uFEFF" + csvEscape(rows), "text/csv;charset=utf-8");
  };
  const exportTop = () => {
    const rows = [["Produit", "Quantité vendue", "Chiffre d'affaires"]];
    report.topProduits.forEach((r) => rows.push([r.name, r.qty, r.ca.toFixed(2)]));
    downloadFile(`malyah-art-top-produits-${todayISO()}.csv`, "\uFEFF" + csvEscape(rows), "text/csv;charset=utf-8");
  };

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KpiCard label="Valeur stock matières" value={fmtEUR(report.valeurStockMatieres)} icon={Beaker} hint="au coût rendu" />
        <KpiCard label="Valeur stock produits" value={fmtEUR(report.valeurStockProduitsPublic)} icon={Package} hint={`coût : ${fmtEUR(report.valeurStockProduitsCout)}`} />
        <KpiCard label="Achats ce mois-ci" value={fmtEUR(report.achatsMois)} icon={PackagePlus} />
        <KpiCard label="Marge moyenne" value={report.margeProduits.length ? `${fmtNum(report.margeProduits.reduce((s, r) => s + r.margePct, 0) / report.margeProduits.length, 0)}%` : "—"} icon={TrendingUp} tone="ok" />
      </div>

      <div className="bg-white rounded-lg border border-slate-200 p-4 sm:p-5">
        <h3 className="text-[15px] font-semibold mb-1" style={{ color: INK }}>Chiffre d'affaires — 12 derniers mois</h3>
        <LineChartCanvas labels={report.monthLabels} data={report.monthValues} color={TEAL} />
      </div>

      <Card title="Top produits" icon={TrendingUp} right={<Btn size="sm" variant="ghost" onClick={exportTop}><Download size={13} /> CSV</Btn>}>
        {report.topProduits.length === 0 ? <p className="text-sm text-slate-400">Aucune vente enregistrée.</p> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
                <th className="pb-2 font-medium">Produit</th><th className="pb-2 font-medium">Quantité vendue</th><th className="pb-2 font-medium">Chiffre d'affaires</th>
              </tr></thead>
              <tbody>
                {report.topProduits.map((r, i) => (
                  <tr key={i} className="border-b border-slate-50">
                    <td className="py-2 text-slate-700">{r.name}</td><td className="py-2">{r.qty}</td><td className="py-2 font-medium">{fmtEUR(r.ca)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Card title="Marges par produit" icon={ShieldAlert} right={<Btn size="sm" variant="ghost" onClick={exportMarges}><Download size={13} /> CSV</Btn>}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-slate-400 text-[12px] border-b border-slate-100">
              <th className="pb-2 font-medium">Produit</th><th className="pb-2 font-medium">Prix public</th><th className="pb-2 font-medium">Coût de revient</th><th className="pb-2 font-medium">Marge</th>
            </tr></thead>
            <tbody>
              {report.margeProduits.map((r, i) => (
                <tr key={i} className="border-b border-slate-50">
                  <td className="py-2 text-slate-700">{r.name}</td>
                  <td className="py-2">{fmtEUR(r.prix)}</td>
                  <td className="py-2 text-slate-500">{fmtEUR(r.cout)}</td>
                  <td className="py-2 font-medium" style={{ color: r.marge >= 0 ? SAGE : BRICK }}>{fmtEUR(r.marge)} ({fmtNum(r.margePct, 0)}%)</td>
                </tr>
              ))}
              {report.margeProduits.length === 0 && (
                <tr><td colSpan={4} className="py-4 text-slate-400 text-center">Aucun produit référencé pour le moment.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

      <p className="text-[12px] text-slate-400 mt-2">Ces informations apparaissent sur les reçus de caisse et les étiquettes réglementaires (identité fabricant CLP).</p>
      <ErrorText>{error}</ErrorText>
      {saved && <p className="text-sm mt-2 flex items-center gap-1.5" style={{ color: SAGE }}><CheckCircle2 size={13} /> Coordonnées enregistrées.</p>}
      <div className="mt-3"><Btn onClick={save} size="md">Enregistrer les coordonnées</Btn></div>
    </Card>
  );
}

function PictogramSlot({ db, setDb, slotKey, label, Fallback }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const current = db.pictograms && db.pictograms[slotKey];

  const handleFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setErr(""); setBusy(true);
    try {
      if (typeof claude === "undefined" || !claude.use) { setErr("Import indisponible dans cet aperçu."); setBusy(false); return; }
      const assets = await claude.use("assets");
      if (!assets) { setErr("Import réservé aux comptes avec droits d'édition sur cette page."); setBusy(false); return; }
      const res = await assets.upload(file);
      setDb((prev) => ({ ...prev, pictograms: { ...prev.pictograms, [slotKey]: { id: res.id, url: res.url } } }));
    } catch (e2) {
      setErr("Échec de l'import (formats acceptés : SVG, PNG, JPEG — 2 Mo max pour un SVG).");
    }
    setBusy(false);
  };

  const remove = () => setDb((prev) => ({ ...prev, pictograms: { ...prev.pictograms, [slotKey]: null } }));

  return (
    <div className="flex items-center gap-3 border border-slate-100 rounded-md p-2.5">
      <div className="w-10 h-10 rounded flex items-center justify-center bg-slate-50 shrink-0 overflow-hidden">
        {current ? <img src={current.url} alt={label} className="w-full h-full object-contain" /> : <Fallback size={20} />}
      </div>
      <div className="min-w-0 flex-1">
        <p className="text-[13px] font-medium text-slate-700 truncate">{label}</p>
        <p className="text-[11px] text-slate-400 truncate">{current ? "Fichier officiel importé" : "Vecteur générique (par défaut)"}</p>
        {err && <p className="text-[11px] mt-0.5" style={{ color: BRICK }}>{err}</p>}
      </div>
      <div className="flex items-center gap-1.5 shrink-0">
        <label className="text-[12px] px-2.5 py-1.5 rounded-md cursor-pointer" style={{ border: `1px solid ${TEAL}`, color: TEAL }}>
          {busy ? "Import…" : "Importer"}
          <input type="file" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg" className="hidden" onChange={handleFile} disabled={busy} />
        </label>
        {current && <button onClick={remove} className="text-slate-300 hover:text-[#9A3F2E]"><Trash2 size={14} /></button>}
      </div>
    </div>
  );
}

function Pictogrammes({ db, setDb }) {
  return (
    <Card title="Pictogrammes officiels (étiquettes)" icon={ScanLine}>
      <p className="text-sm text-slate-500 mb-3">
        Les icônes intégrées par défaut sont des vecteurs génériques indicatifs — pas les fichiers officiels sous licence. Une fois vos pictogrammes obtenus (CNBP/AFNOR pour la filière bougie, ou votre graphiste pour le losange CLP), importez-les ici : ils remplacent automatiquement les icônes génériques sur toutes vos étiquettes, sans autre action.
      </p>
      <div className="space-y-2">
        <PictogramSlot db={db} setDb={setDb} slotKey="ghs07" label="CLP — Mise en garde (GHS07)" Fallback={PictoGHS07} />
        <PictogramSlot db={db} setDb={setDb} slotKey="unattended" label="Bougie sans surveillance" Fallback={PictoUnattended} />
        <PictogramSlot db={db} setDb={setDb} slotKey="children" label="Hors de portée des enfants" Fallback={PictoChildren} />
        <PictogramSlot db={db} setDb={setDb} slotKey="burn" label="Risque de brûlure" Fallback={PictoBurn} />
      </div>
      <p className="text-[11px] text-slate-400 mt-3">Formats acceptés : SVG (vectoriel, recommandé), PNG, JPEG. 2 Mo maximum par fichier SVG.</p>
    </Card>
  );
}

/* ------------------------------- Sauvegarde ------------------------------ */

async function downloadFile(filename, content, type) {
  try {
    if (typeof claude !== "undefined" && claude.use) {
      const dl = await claude.use("downloads");
      if (dl) {
        try { await dl.save({ filename, data: content }); } catch (err) {}
        return;
      }
    }
  } catch (e) {}
  try {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  } catch (e) {}
}
function csvEscape(rows) {
  return rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
}

function Sauvegarde({ db, setDb, driveStatus, driveLastSync, connectDrive, disconnectDrive }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const download = downloadFile;

  const exportSalesCSV = () => {
    const rows = [["Date", "Client", "Canal", "Paiement", "Produit", "N° de lot", "Quantité", "Prix unitaire", "Total ligne", "Frais de port"]];
    db.sales.forEach((o) => {
      o.items.forEach((it) => {
        rows.push([o.date, o.clientName, o.channel, o.payment, it.name, it.batchNumber, it.qty, it.unitPrice.toFixed(2), (it.qty * it.unitPrice).toFixed(2), o.shippingCost.toFixed(2)]);
      });
    });
    download(`malyah-art-ventes-${todayISO()}.csv`, "\uFEFF" + csvEscape(rows), "text/csv;charset=utf-8");
  };

  const exportJSON = () => download(`malyah-art-sauvegarde-${todayISO()}.json`, JSON.stringify(db, null, 2), "application/json");

  const importJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { setDb(withDefaults(JSON.parse(reader.result))); } catch (err) { alert("Fichier invalide."); } };
    reader.readAsText(file);
  };

  const reset = () => { setDb(seedData()); setConfirmReset(false); };

  return (
    <div className="space-y-4 max-w-xl">
      {driveStatus && driveStatus !== "unavailable" && (
        <Card title="Google Drive" icon={Cloud}>
          {driveStatus === "connected" ? (
            <>
              <p className="text-sm flex items-center gap-1.5" style={{ color: SAGE }}><CheckCircle2 size={14} /> Connecté — synchronisation automatique active.</p>
              {driveLastSync && <p className="text-[12px] text-slate-400 mt-1">Dernière synchro : {driveLastSync.toLocaleTimeString("fr-FR")}</p>}
              <div className="mt-3"><Btn variant="ghost" size="sm" onClick={disconnectDrive}>Déconnecter</Btn></div>
            </>
          ) : driveStatus === "connecting" ? (
            <p className="text-sm text-slate-500">Connexion en cours…</p>
          ) : (
            <>
              <p className="text-sm text-slate-500 mb-3">
                {driveStatus === "error" ? "La connexion a échoué. " : ""}
                Connectez votre Google Drive pour synchroniser automatiquement vos données entre votre téléphone et votre ordinateur. Le fichier est stocké dans un espace privé de votre Drive, invisible dans vos dossiers habituels.
              </p>
              <Btn onClick={connectDrive}><Cloud size={15} /> Connecter Google Drive</Btn>
            </>
          )}
        </Card>
      )}

      <Card title="Export comptable" icon={Download}>
        <p className="text-sm text-slate-500 mb-3">Export CSV du détail des ventes (compatible Excel / comptabilité).</p>
        <Btn onClick={exportSalesCSV}><Download size={15} /> Exporter les ventes (CSV)</Btn>
      </Card>

      <Card title="Sauvegarde complète (JSON)" icon={Save}>
        <p className="text-sm text-slate-500 mb-3">
          {driveStatus === "connected"
            ? "Vos données sont déjà synchronisées via Google Drive. Cet export reste utile pour un archivage ponctuel."
            : "Toutes les données de l'atelier sont stockées localement sur cet appareil. Exportez une sauvegarde pour la transférer ou la conserver."}
        </p>
        <div className="flex flex-wrap gap-2">
          <Btn variant="ghost" onClick={exportJSON}><Download size={15} /> Exporter (JSON)</Btn>
          <label className="inline-flex items-center gap-1.5 px-3.5 py-2 text-sm rounded-md cursor-pointer" style={{ border: `1px solid ${TEAL}33`, color: TEAL }}>
            <Upload size={15} /> Importer
            <input type="file" accept="application/json" className="hidden" onChange={importJSON} />
          </label>
        </div>
      </Card>

      <Card title="Réinitialiser">
        <p className="text-sm text-slate-500 mb-3">Recharge les données de démonstration et efface les modifications en cours.</p>
        {confirmReset ? (
          <div className="flex gap-2">
            <Btn variant="danger" onClick={reset}><RotateCcw size={15} /> Confirmer</Btn>
            <Btn variant="ghost" onClick={() => setConfirmReset(false)}>Annuler</Btn>
          </div>
        ) : <Btn variant="ghost" onClick={() => setConfirmReset(true)}><RotateCcw size={15} /> Réinitialiser les données</Btn>}
      </Card>

      <Card title="Historique des mouvements">
        <ul className="text-sm space-y-2 max-h-64 overflow-y-auto">
          {db.movements.map((m) => (
            <li key={m.id} className="flex justify-between border-b border-slate-50 pb-1.5 gap-2">
              <span className="text-slate-600">{m.detail}</span>
              <span className="text-slate-400 text-[12px] whitespace-nowrap shrink-0">{m.date}</span>
            </li>
          ))}
        </ul>
      </Card>
    </div>
  );
}

/* ============================================================ */
/* Montage                                                        */

const root = ReactDOM.createRoot(document.getElementById("root"));
try {
  root.render(<MalyahArtApp />);
} catch (e) {
  console.error(e);
  root.render(
    <div style={{ padding: 24, fontFamily: "sans-serif" }}>
      <h2>Erreur de chargement</h2>
      <pre style={{ whiteSpace: "pre-wrap", fontSize: 12 }}>{String(e)}</pre>
    </div>
  );
}

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });

</script>
