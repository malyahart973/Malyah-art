<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Malyah Art — Gestion atelier</title>
<link rel="icon" href="./favicon.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#07516A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Malyah Art" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --ink: #083247;
  --teal: #0B91AE;
  --teal-deep: #07516A;
  --accent: #35C0D8;
  --pale: #E7F7FA;
  --paper: #F4FAFC;
  --brick: #C34A45;
  --sage: #2F8A73;
  --slate-700: #21475A;
  --slate-500: #557384;
  --slate-400: #5A7787;
  --slate-200: #E2E8F0;
  --slate-100: #F1F5F9;
  --slate-50: #F8FAFC;
  box-sizing: border-box;
}
* { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--slate-700);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .ma-brand-name, .ma-h2, .ma-banner-title, .ma-kpi-value { font-family: Georgia, "Times New Roman", serif; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.ma-muted { color: var(--slate-400); }
.ma-sm { font-size: 12px; }
.ma-strong { font-weight: 600; }
.ma-icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

#app { display: flex; min-height: 100vh; align-items: stretch; }
.loading-screen { padding: 60px; text-align: center; color: var(--slate-400); }

/* ---------- Sidebar ---------- */
.ma-sidebar {
  width: 230px; flex-shrink: 0; background: var(--ink); color: #fff;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.ma-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; }
.ma-logo { height: 34px; width: auto; background: #fff; border-radius: 6px; padding: 2px; }
.ma-brand-name { font-size: 15px; margin: 0; line-height: 1.1; }
.ma-brand-sub { font-size: 10.5px; color: rgba(255,255,255,.6); margin: 2px 0 0; }
.ma-sidebar-close { display: none; margin-left: auto; color: rgba(255,255,255,.7); }
.ma-nav { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.ma-nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px;
  background: none; border: none; color: rgba(255,255,255,.62); font-size: 13.5px; font-weight: 500; text-align: left;
}
.ma-nav-item.active { background: var(--teal); color: #fff; font-weight: 600; }
.ma-nav-item:hover:not(.active) { background: rgba(255,255,255,.08); }
.ma-sidebar-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); }
.ma-sidebar-tagline { font-size: 11px; color: rgba(255,255,255,.7); margin: 0; }
.ma-sidebar-tagline-sub { font-size: 10px; color: rgba(255,255,255,.35); margin: 2px 0 0; }
.ma-nav-overlay { display: none; }

/* ---------- Top bar ---------- */
.ma-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ma-topbar { background: #fff; border-bottom: 1px solid var(--slate-200); position: sticky; top: 0; z-index: 20; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.ma-menu-btn { display: none; }
.ma-icon-btn { background: none; border: none; color: var(--slate-500); padding: 4px; display: flex; align-items: center; }
.ma-search { position: relative; flex: 1; max-width: 420px; display: flex; align-items: center; }
.ma-search svg { position: absolute; left: 10px; color: var(--slate-400); pointer-events: none; }
.ma-search input { width: 100%; border: 1px solid var(--slate-200); border-radius: 6px; padding: 8px 10px 8px 32px; font-size: 13px; background: var(--slate-50); }
.ma-search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.ma-search-results { position: absolute; top: 100%; margin-top: 4px; width: 100%; background: #fff; border: 1px solid var(--slate-200); border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.08); z-index: 30; overflow: hidden; }
.ma-search-result { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 12px; background: none; border: none; text-align: left; font-size: 13px; }
.ma-search-result:hover { background: var(--slate-50); }
.ma-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.ma-notif-wrap { position: relative; }
.ma-badge-dot { position: absolute; top: -4px; right: -4px; background: var(--brick); color: #fff; font-size: 10px; border-radius: 999px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
.ma-notif-panel { position: absolute; right: 0; top: 100%; margin-top: 8px; width: 280px; max-height: 300px; overflow-y: auto; background: #fff; border: 1px solid var(--slate-200); border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.08); z-index: 30; }
.ma-notif-item { width: 100%; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--slate-50); background: none; border-left: none; border-right: none; border-top: none; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--brick); }
.ma-p3 { padding: 12px; }
.ma-sync-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--slate-400); white-space: nowrap; }
.ma-sync-drive, .ma-sync-cloud { color: var(--sage); }
.ma-avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }

.ma-content { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; padding: 20px 24px; }
.ma-stack { display: flex; flex-direction: column; gap: 20px; }
.ma-h2 { font-size: 22px; margin: 0 0 2px; color: var(--ink); }

/* ---------- Grids & cards ---------- */
.ma-grid { display: grid; gap: 14px; }
.ma-grid-kpi { grid-template-columns: repeat(5, 1fr); }
.ma-grid-2-1 { grid-template-columns: 2fr 1fr; }
.ma-grid-1-2 { grid-template-columns: 1fr 2fr; }
.ma-grid-3 { grid-template-columns: repeat(3, 1fr); }
.ma-grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 900px) {
  .ma-grid-kpi { grid-template-columns: repeat(2, 1fr); }
  .ma-grid-2-1, .ma-grid-1-2, .ma-grid-3, .ma-grid-2 { grid-template-columns: 1fr; }
}

.ma-card { background: #fff; border: 1px solid var(--slate-200); border-radius: 10px; }
.ma-card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
.ma-card-head h3 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; color: var(--ink); font-family: inherit; font-weight: 600; }
.ma-card-body { padding: 14px 16px 16px; }

.ma-kpi { background: #fff; border: 1px solid var(--slate-200); border-radius: 10px; padding: 14px; }
.ma-kpi-label { font-size: 12px; color: var(--slate-400); margin: 0 0 6px; }
.ma-kpi-value { font-size: 22px; margin: 0; color: var(--ink); }
.ma-kpi-hint { font-size: 11px; color: var(--slate-400); margin: 4px 0 0; }
.ma-kpi-alert .ma-kpi-value { color: var(--brick); }
.ma-kpi-ok .ma-kpi-value { color: var(--sage); }
.ma-kpi-hero { background: linear-gradient(135deg, var(--teal-deep), var(--teal)); border: none; }
.ma-kpi-hero .ma-kpi-label, .ma-kpi-hero .ma-kpi-hint { color: rgba(255,255,255,.75); }
.ma-kpi-hero .ma-kpi-value { color: #fff; }

.ma-bars { display: flex; align-items: flex-end; gap: 10px; height: 140px; margin-top: 10px; }
.ma-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
.ma-bar { width: 100%; max-width: 34px; background: var(--teal); border-radius: 4px 4px 0 0; }
.ma-bar-label { font-size: 11px; color: var(--slate-400); }

.ma-legend { display: flex; flex-direction: column; gap: 8px; }
.ma-legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.ma-legend-row > span:nth-child(2) { flex: 1; }
.ma-legend-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }

.ma-row-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--slate-50); font-size: 13.5px; }
.ma-row-line:last-child { border-bottom: none; }
.ma-row-btn { width: 100%; background: none; border: none; text-align: left; }

.ma-hero-panel { background: linear-gradient(135deg, var(--teal-deep), var(--teal)); color: #fff; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
.ma-hero-head { display: flex; align-items: center; gap: 8px; }
.ma-hero-head h3 { margin: 0; font-size: 15px; }
.ma-hero-panel p { margin: 0; font-size: 13px; color: rgba(255,255,255,.8); }

.ma-quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 700px) { .ma-quick-grid { grid-template-columns: repeat(2, 1fr); } }
.ma-quick-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border: 1px solid var(--slate-200); border-radius: 8px; background: #fff; font-size: 12px; color: var(--slate-500); }
.ma-quick-btn:hover { border-color: var(--teal); color: var(--teal-deep); }

.ma-banner { background: var(--ink); color: #fff; border-radius: 10px; padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.ma-banner-title { margin: 0; font-size: 16px; }
.ma-banner-sub { margin: 2px 0 0; font-size: 12px; color: rgba(255,255,255,.5); }
.ma-banner-checks { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: rgba(255,255,255,.8); }
.ma-banner-checks span { display: flex; align-items: center; gap: 6px; }

/* ---------- Formulaires / boutons ---------- */
.ma-field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--slate-500); }
.ma-field input, .ma-field select, .ma-field textarea {
  border: 1px solid var(--slate-200); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; color: var(--slate-700); background: #fff;
}
.ma-field input:focus, .ma-field select:focus, .ma-field textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

.ma-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 6px; border: none; font-size: 13.5px; font-weight: 500; }
.ma-btn-primary { background: var(--teal); color: #fff; }
.ma-btn-accent { background: var(--accent); color: var(--ink); }
.ma-btn-ghost { background: none; border: 1px solid var(--slate-200); color: var(--slate-500); }
.ma-btn-danger { background: none; color: var(--brick); }
.ma-btn-link { background: none; color: var(--teal); padding: 0; font-size: 12px; }
.ma-btn-sm { padding: 6px 10px; font-size: 12.5px; }
.ma-btn:disabled { opacity: .45; cursor: not-allowed; }

.ma-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; }
.ma-badge-neutral { background: var(--slate-100); color: var(--slate-500); }
.ma-badge-alert { background: #F5E3DF; color: #9A3F2E; }
.ma-badge-ok { background: #E4EFE7; color: #3E6650; }
.ma-badge-accent { background: #DFF3F7; color: #096781; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--slate-400); border-bottom: 1px solid var(--slate-100); padding-bottom: 8px; }
td { padding: 9px 6px 9px 0; border-bottom: 1px solid var(--slate-50); }
tr:last-child td { border-bottom: none; }
.ma-table-wrap { overflow-x: auto; }
.ma-search-inline { position: relative; max-width: 320px; margin-bottom: 12px; display: flex; align-items: center; }
.ma-search-inline svg { position: absolute; left: 9px; color: var(--slate-400); pointer-events: none; }
.ma-search-inline input { width: 100%; border: 1px solid var(--slate-200); border-radius: 6px; padding: 7px 10px 7px 30px; font-size: 13px; }
.ma-search-inline input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.ma-barcode-box { background: var(--slate-50); border-radius: 6px; padding: 10px; display: inline-block; }
table input[type="number"], table input[type="text"] { border: 1px solid var(--slate-200); border-radius: 5px; padding: 5px 7px; font-size: 13px; }
table input:focus { outline: 2px solid var(--accent); border-color: transparent; }

.ma-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.ma-modal { background: #fff; border-radius: 10px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; }

.ma-error { color: var(--brick); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 8px; }

/* ---------- Caisse ---------- */
.ma-caisse-layout { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-top: 4px; }
@media (max-width: 800px) { .ma-caisse-layout { grid-template-columns: 1fr; } }
.ma-tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 500px) { .ma-tile-grid { grid-template-columns: repeat(2, 1fr); } }
.ma-tile { position: relative; text-align: left; border: 1px solid var(--slate-200); border-radius: 8px; padding: 10px; background: #fff; }
.ma-tile.in-cart { border-color: var(--teal); background: var(--pale); }
.ma-tile.disabled { opacity: .5; cursor: not-allowed; }
.ma-tile-qty { position: absolute; top: 6px; right: 6px; background: var(--teal); color: #fff; border-radius: 999px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.ma-tile-name { font-size: 13px; margin: 0; padding-right: 20px; color: var(--slate-700); }
.ma-tile-price { font-size: 12px; margin: 4px 0 0; color: var(--slate-400); }
.ma-tile-stock { font-size: 11px; margin: 2px 0 0; color: #94A3B8; }
.ma-tile-stock.out { color: var(--brick); }
.ma-cart-box { border: 1px solid var(--slate-200); border-radius: 8px; max-height: 420px; overflow-y: auto; }
.ma-cart-line { padding: 10px; border-bottom: 1px solid var(--slate-50); }
.ma-cart-line-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.ma-cart-line-mid { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.ma-qty-stepper { display: flex; align-items: center; gap: 6px; }
.ma-qty-stepper button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--slate-200); background: #fff; }
.ma-qty-stepper button:disabled { opacity: .3; }
.ma-caisse-total { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--slate-100); padding-top: 10px; margin-top: 12px; }

/* ---------- Matières / Production ---------- */
.ma-link-inline { background: none; border: none; color: var(--slate-500); display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; }
.ma-link-inline:hover { text-decoration: underline; }
.ma-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.ma-pill { padding: 7px 14px; border-radius: 999px; font-size: 13px; background: #fff; color: var(--slate-500); border: 1px solid var(--slate-200); }
.ma-pill.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.ma-needs-box { background: var(--slate-50); border-radius: 8px; padding: 12px; margin-top: 14px; }
.ma-needs-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.ma-needs-list li { display: flex; justify-content: space-between; gap: 10px; }

/* ---------- Traçabilité / fiche A4 ---------- */
.ma-trace-block { border: 1px solid var(--slate-100); border-radius: 8px; padding: 12px; }
.ma-modal-wide { max-width: 780px; padding: 0; }
.ma-sheet-toolbar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--slate-100); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-radius: 10px 10px 0 0; }
.ma-sheet-body { padding: 26px 34px; font-size: 13px; color: var(--slate-700); }
.ma-sheet-header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 18px; gap: 14px; flex-wrap: wrap; }
.ma-sheet-label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--slate-400); margin: 0 0 6px; }
.ma-sheet-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 20px; }
.ma-sheet-table th { border-bottom: 1px solid var(--slate-200); font-weight: 500; color: var(--slate-500); padding-bottom: 6px; }
.ma-sheet-table td.py-15 { padding: 6px 0; border-bottom: 1px solid var(--slate-50); }
.ma-sheet-hazard { border: 1px solid var(--slate-100); border-radius: 8px; padding: 12px; margin-bottom: 20px; }

/* ---------- Étiquettes ---------- */
.ma-etq-layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.ma-label { border: 2px solid var(--ink); border-radius: 6px; background: #fff; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }

/* ---------- Impression ---------- */
@media print {
  body * { visibility: hidden; }
  #print-label-area, #print-label-area *, #print-receipt-area, #print-receipt-area *, #print-traceability-area, #print-traceability-area * { visibility: visible; }
  #print-label-area { position: absolute; top: 0; left: 0; }
  #print-receipt-area { position: absolute; top: 0; left: 0; width: 80mm; padding: 4mm; }
  #print-traceability-area { position: absolute; top: 0; left: 0; width: 100%; padding: 0; }
  @page { size: A4; margin: 15mm; }
}

.ma-ingredients { list-style: none; padding: 0; margin: 0; font-size: 13.5px; color: var(--slate-500); display: flex; flex-direction: column; gap: 3px; }
.ma-readonly { background: var(--slate-50); color: var(--slate-500); border: 1px solid var(--slate-200); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; }
.ma-cost-line { display: flex; justify-content: space-between; font-size: 13.5px; border-top: 1px solid var(--slate-100); padding-top: 8px; margin-top: 8px; }
.ma-cost-total { border-top-color: var(--slate-200); font-weight: 600; color: var(--ink); font-size: 15px; }
.ma-tarif-panel { background: var(--pale); border-radius: 10px; padding: 16px; }
.ma-tarif-suggested { background: #fff; border: 1px solid var(--slate-200); border-radius: 8px; padding: 12px; }
.ma-tarif-price { font-size: 24px; margin: 2px 0 0; color: var(--teal); font-family: Georgia, serif; }

.ma-picto-slot { display: flex; align-items: center; gap: 12px; border: 1px solid var(--slate-100); border-radius: 8px; padding: 10px; }
.ma-picto-preview { width: 40px; height: 40px; border-radius: 6px; background: var(--slate-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.ma-upload-label { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--teal); color: var(--teal); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
@media (max-width: 900px) {
  .ma-sidebar { position: fixed; left: -260px; z-index: 60; transition: left .2s; }
  .ma-sidebar.open { left: 0; }
  .ma-sidebar-close { display: block; }
  .ma-nav-overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; }
  .ma-menu-btn { display: block; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Minimal QR Code encoder (model 2), numeric/alphanumeric/byte mode, error correction levels L/M/Q/H.
   Public-domain algorithm (Reed-Solomon), compact vanilla-JS implementation, no external dependency. */
(function (global) {
  var EXP_TABLE = new Array(256);
  var LOG_TABLE = new Array(256);
  for (var i = 0; i < 8; i++) EXP_TABLE[i] = 1 << i;
  for (var i = 8; i < 256; i++) {
    EXP_TABLE[i] = EXP_TABLE[i - 4] ^ EXP_TABLE[i - 5] ^ EXP_TABLE[i - 6] ^ EXP_TABLE[i - 8];
  }
  for (var i = 0; i < 255; i++) LOG_TABLE[EXP_TABLE[i]] = i;

  function glog(n) { if (n < 1) throw new Error("glog(" + n + ")"); return LOG_TABLE[n]; }
  function gexp(n) { while (n < 0) n += 255; while (n >= 256) n -= 255; return EXP_TABLE[n]; }

  function Polynomial(num, shift) {
    var offset = 0;
    while (offset < num.length && num[offset] === 0) offset++;
    this.num = new Array(num.length - offset + (shift || 0));
    for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
    for (var i = 0; i < (shift || 0); i++) this.num[num.length - offset + i] = 0;
  }
  Polynomial.prototype.get = function (i) { return this.num[i]; };

async function driveFindOrCreateFile(token) {
    const listRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=" + encodeURIComponent(`name='${DRIVE_FILE_NAME}'`) + "&fields=files(id,modifiedTime)", { headers: { Authorization: "Bearer " + token } });
    if (!listRes.ok)
        throw new Error("drive_list_failed");
    const listData = await listRes.json();
    if (listData.files && listData.files.length > 0)
        return listData.files[0];
    const boundary = "malyahartboundary";
    const createRes = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": `multipart/related; boundary=${boundary}` },
        body: `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
            JSON.stringify({ name: DRIVE_FILE_NAME, parents: ["appDataFolder"] }) +
            `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n{}\r\n--${boundary}--`,
    });
    if (!createRes.ok)
        throw new Error("drive_create_failed");
    const created = await createRes.json();
    return { id: created.id, modifiedTime: new Date().toISOString() };
}
async function driveReadFile(token, fileId) {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: "Bearer " + token } });
    if (res.status === 404)
        return null;
    if (!res.ok)
        throw new Error("drive_read_failed");
    const text = await res.text();
    if (!text)
        return null;
    try {
        return JSON.parse(text);
    }
    catch (e) {
        return null;
    }
}
async function driveWriteFile(token, fileId, data) {
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(data),
    });
    if (!res.ok)
        throw new Error("drive_write_failed");
}

function nextBatchNumber(recipeName, existingBatches) {
    const datePart = todayISO().replace(/-/g, "");
    const key = (recipeName || "PROD").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || "PROD";
    let n = 1, candidate;
    do {
        candidate = `LOT-${datePart}-${key}${String(n).padStart(2, "0")}`;
        n += 1;
    } while (existingBatches.some((b) => b.batchNumber === candidate));
    return candidate;
}
function nextSku(existingProducts) {
    let n = existingProducts.length + 1;
    let candidate;

        n += 1;
    } while (existingProducts.some((p) => p.sku === candidate));
    return candidate;
}
/* Coût unitaire rendu Guyane — figé à l'achat (indépendant du stock restant). */
function unitCostGuyane(material) {
    const base = material.purchasePrice * (1 + material.freightPct);
    return material.initialQty > 0 ? base / material.initialQty : 0;
}
function recipeUnitCost(recipe, rawMaterials) {
    const raw = recipe.items.reduce((sum, it) => {
        const mat = rawMaterials.find((m) => m.id === it.materialId);
        return mat ? sum + it.qty * unitCostGuyane(mat) : sum;
    }, 0);
    const yieldPct = recipe.yieldPct > 0 ? recipe.yieldPct : 100;
    return raw / (yieldPct / 100);
}

function allocateBatches(db, productId, qty) {
    const batches = db.batches
        .filter((b) => b.productId === productId && b.status === "Conforme" && b.quantityRemaining > 0)
        .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const allocations = [];
    let remaining = qty;
    for (const b of batches) {
        if (remaining <= 0)
            break;
        const take = Math.min(b.quantityRemaining, remaining);
        allocations.push({ batchNumber: b.batchNumber, qty: take });
        remaining -= take;
    }
    return { allocations, fulfilled: remaining <= 0, shortfall: remaining };
}
function totalAvailableStock(db, productId) {
    return db.batches.filter((b) => b.productId === productId && b.status === "Conforme" && b.quantityRemaining > 0)
        .reduce((s, b) => s + b.quantityRemaining, 0);
}

async function downloadFile(filename, content, type) {
    try {
        if (typeof claude !== "undefined" && claude.use) {
            const dl = await claude.use("downloads");
            if (dl) {
                try {
                    await dl.save({ filename, data: content });
                }
                catch (err) { }
                return;
            }
        }
    }
    catch (e) { }
    try {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }
    catch (e) { }
}

  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.db));
      if (state.driveStatus === "connected" && window.__driveFileId) {
        const cached = loadCachedDriveToken();
        if (cached) {
          try {
            await driveWriteFile(cached.token, window.__driveFileId, state.db);
            window.__driveLastPayload = JSON.stringify(state.db);
            state.driveLastSync = new Date();
          } catch (e) {}
        }
      }
      state.syncMode = state.driveStatus === "connected" ? "drive" : "local";
      state.status = "Enregistré";
    } catch (e) {
      state.status = "Échec enregistrement";
    }
    render();
    setTimeout(() => { state.status = ""; render(); }, 1500);
  }, 500);
}

    (db.clients || []).forEach((c) => { if (c.name.toLowerCase().includes(query)) results.push({ label: c.name, hint: "Client", tab: "clients" }); });
    (db.suppliers || []).forEach((s) => { if (s.name.toLowerCase().includes(query)) results.push({ label: s.name, hint: "Fournisseur", tab: "fournisseurs" }); });
    results = results.slice(0, 8);
  }
  const alerts = [];
  db.rawMaterials.forEach((m) => { if (m.stockQuantity <= m.reorderThreshold) alerts.push({ label: `Stock faible — ${m.name}`, tab: "matieres" }); });
  db.products.forEach((p) => { if (p.stockQuantity <= p.alertThreshold) alerts.push({ label: `Stock faible — ${p.name}`, tab: "produits" }); });
  db.batches.forEach((b) => { if (b.status === "En Cure") alerts.push({ label: `Lot en cours — ${b.batchNumber}`, tab: "production" }); });

  const initials = (db.workshop.name || "M A").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const syncLabel = state.syncMode === "cloud" ? "En ligne" : state.syncMode === "drive" ? "Google Drive" : "Local";

  return `
    <header class="ma-topbar">
      <button class="ma-icon-btn ma-menu-btn" data-action="open-nav">${icon("menu")}</button>
      <div class="ma-search">
        ${icon("search")}
        <input type="text" placeholder="Rechercher un produit, une matière, un lot…" value="${esc(ui("topbar").query || "")}" data-bind="topbar.query" data-action="topbar-search" />
        ${results.length ? `<div class="ma-search-results">${results.map((r) => `<button class="ma-search-result" data-action="goto-tab" data-tab="${r.tab}">
          <span>${esc(r.label)}</span><span class="ma-muted">${esc(r.hint)}</span></button>`).join("")}</div>` : ""}
      </div>
      <div class="ma-topbar-right">
        <div class="ma-notif-wrap">
          <button class="ma-icon-btn" data-action="toggle-notifs">${icon("bell")}${alerts.length ? `<span class="ma-badge-dot">${alerts.length}</span>` : ""}</button>
          ${ui("topbar").showNotifs ? `<div class="ma-notif-panel">
            ${alerts.length === 0 ? `<p class="ma-muted ma-p3">Aucune alerte à surveiller.</p>` :
              alerts.map((a) => `<button class="ma-notif-item" data-action="goto-tab" data-tab="${a.tab}">${icon("alert")}${esc(a.label)}</button>`).join("")}
          </div>` : ""}
        </div>
        <span class="ma-sync-badge ma-sync-${state.syncMode}">${icon(state.syncMode === "local" ? "cloud-off" : "cloud")}${syncLabel}${state.status ? ` · ${esc(state.status)}` : ""}</span>
        <div class="ma-avatar">${esc(initials)}</div>
      </div>
    </header>`;
}

function badge(text, tone) {
  return `<span class="ma-badge ma-badge-${tone || "neutral"}">${text}</span>`;

function btn(label, action, opts) {

/* ============================================================ */
/* Accueil (tableau de bord)                                      */
/* ============================================================ */
function renderAccueil(db) {
  let ca = 0, caJour = 0;
  const today = todayISO();
  const byMonth = {};
  const byChannel = {};
  db.sales.forEach((o) => {
    const monthKey = o.date.slice(0, 7);
    o.items.forEach((it) => {
      const total = it.qty * it.unitPrice;
      ca += total;
      if (o.date === today) caJour += total;
      byMonth[monthKey] = (byMonth[monthKey] || 0) + total;
      byChannel[o.channel] = (byChannel[o.channel] || 0) + total;
    });
  });
  const stockFini = db.products.reduce((s, p) => s + p.stockQuantity, 0);
  const alertesMatieres = db.rawMaterials.filter((m) => m.stockQuantity <= m.reorderThreshold);
  const alertesProduits = db.products.filter((p) => p.stockQuantity <= p.alertThreshold);
  const dernieresVentes = [...db.sales].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);
  const enCours = db.batches.filter((b) => b.status !== "Conforme").slice(0, 5);
  const derniersLots = [...db.batches].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 5);
  const alertCount = alertesMatieres.length + alertesProduits.length;

  const months = [];
  const d = new Date();
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    months.push({ key: `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`, label: dt.toLocaleDateString("fr-FR", { month: "short" }) });
  }
  const maxMonth = Math.max(1, ...months.map((m) => byMonth[m.key] || 0));

  const kpi = (label, value, hint, tone) => `
    <div class="ma-kpi ma-kpi-${tone || "neutral"}">
      <p class="ma-kpi-label">${esc(label)}</p>
      <p class="ma-kpi-value">${value}</p>
      ${hint ? `<p class="ma-kpi-hint">${esc(hint)}</p>` : ""}
    </div>`;

  const quickAccess = [
    { id: "caisse", label: "Nouvelle vente", icon: "cart" },
    { id: "production", label: "Lancer un lot", icon: "factory" },
    { id: "achats", label: "Nouvel achat", icon: "package-plus" },
    { id: "matieres", label: "Ajouter matière", icon: "beaker" },
    { id: "produits", label: "Voir produits", icon: "package" },
    { id: "etiquettes", label: "Étiquettes", icon: "tag" },
    { id: "tracabilite", label: "Traçabilité", icon: "branch" },
    { id: "rapports", label: "Rapports", icon: "bar-chart" },
  ].map((a) => `<button class="ma-quick-btn" data-action="goto-tab" data-tab="${a.id}">${icon(a.icon, 18)}<span>${esc(a.label)}</span></button>`).join("");

  const barChart = `<div class="ma-bars">${months.map((m) => {
    const v = byMonth[m.key] || 0;
    const h = Math.round((v / maxMonth) * 100);
    return `<div class="ma-bar-col"><div class="ma-bar" style="height:${Math.max(h, 3)}%" title="${esc(m.label)} : ${fmtEUR(v)}"></div><span class="ma-bar-label">${esc(m.label)}</span></div>`;
  }).join("")}</div>`;

  const channelColors = { "Marché": "var(--teal)", "B2C Direct": "var(--accent)", "B2B Boutique": "var(--sage)", "Boutique Éphémère": "var(--brick)", "Commande Sur Mesure": "#8A97AC" };
  const channelRows = Object.keys(byChannel).map((c) => `
    <div class="ma-legend-row"><span class="ma-legend-dot" style="background:${channelColors[c] || "#CBD5E1"}"></span><span>${esc(c)}</span><span class="ma-muted">${fmtEUR(byChannel[c])}</span></div>`).join("");

  const ventesTable = dernieresVentes.length === 0 ? `<p class="ma-muted">Aucune vente enregistrée.</p>` : dernieresVentes.map((o) => {
    const total = o.items.reduce((s, it) => s + it.qty * it.unitPrice, 0) + o.shippingCost;
    return `<div class="ma-row-line"><div><p>${esc(o.clientName)}</p><p class="ma-muted ma-sm">${esc(o.date)} · ${esc(o.channel)}</p></div><span class="ma-strong">${fmtEUR(total)}</span></div>`;
  }).join("");

  const prodTable = enCours.length === 0 ? `<p class="ma-muted">Aucun lot en cours.</p>` : enCours.map((b) => {
    const p = db.products.find((pp) => pp.id === b.productId);
    return `<div class="ma-row-line"><div><p>${esc(p ? p.name : "")}</p><p class="ma-muted ma-sm mono">${esc(b.batchNumber)}</p></div>${badge(esc(b.status), b.status === "Prêt" ? "accent" : "neutral")}</div>`;
  }).join("");

  const lotsTable = derniersLots.length === 0 ? `<p class="ma-muted">Aucun lot enregistré.</p>` : derniersLots.map((b) => `
    <div class="ma-row-line"><div><p class="mono ma-sm">${esc(b.batchNumber)}</p><p class="ma-muted ma-sm">${esc(b.date)}</p></div>${badge(esc(b.status), b.status === "Conforme" ? "ok" : "neutral")}</div>`).join("");

  const alertsList = (alertesMatieres.length === 0 && alertesProduits.length === 0) ? `<p class="ma-muted">Rien à signaler pour le moment.</p>` :
    alertesMatieres.map((m) => `<button class="ma-row-line ma-row-btn" data-action="goto-tab" data-tab="matieres"><span>Stock faible — ${esc(m.name)}</span>${badge(`${fmtNum(m.stockQuantity)} ${esc(m.unit)}`, "alert")}</button>`).join("") +
    alertesProduits.map((p) => `<button class="ma-row-line ma-row-btn" data-action="goto-tab" data-tab="produits"><span>Stock faible — ${esc(p.name)}</span>${badge(`${p.stockQuantity} unités`, "alert")}</button>`).join("");

  return `
    <div class="ma-stack">
      <div><h2 class="ma-h2">Tableau de bord</h2><p class="ma-muted">Vue d'ensemble de votre activité</p></div>
      <div class="ma-grid ma-grid-kpi">
        ${kpi("CA du jour", fmtEUR(caJour), null, "hero")}
        ${kpi("CA cumulé", fmtEUR(ca), `${db.sales.length} commande(s)`)}
        ${kpi("Produits actifs", db.products.length, `${stockFini} unités en stock`)}
        ${kpi("Lots actifs", db.batches.length)}
        ${kpi("Alertes stock", alertCount, null, alertCount > 0 ? "alert" : "ok")}
      </div>
      <div class="ma-grid ma-grid-2-1">
        ${card("Évolution du chiffre d'affaires", `<p class="ma-muted ma-sm">6 derniers mois</p>${barChart}`)}
        ${card("Répartition des ventes", Object.keys(byChannel).length === 0 ? `<p class="ma-muted">Aucune vente enregistrée.</p>` : `<div class="ma-legend">${channelRows}</div>`)}
      </div>
      <div class="ma-grid ma-grid-1-2">
        ${card("À surveiller", alertsList, { icon: "alert" })}
        <div class="ma-hero-panel">
          <div class="ma-hero-head">${icon(state.syncMode === "local" ? "cloud-off" : "cloud", 18)}<h3>${state.syncMode === "cloud" ? "Sauvegarde active" : state.syncMode === "drive" ? "Synchronisé — Google Drive" : "Sauvegarde locale"}</h3></div>
          <p>${state.syncMode === "cloud" ? "Vos données sont enregistrées sur votre compte et retrouvées automatiquement sur cette page." : state.syncMode === "drive" ? "Vos données sont synchronisées avec votre Google Drive." : "Vos données sont enregistrées dans ce navigateur. Exportez régulièrement une sauvegarde JSON."}</p>
          ${state.driveStatus === "disconnected" || state.driveStatus === "error" ? btn("Connecter Google Drive", "connect-drive", { variant: "accent", size: "sm", icon: "cloud" }) : btn("Exporter les ventes (CSV)", "goto-sauvegarde", { variant: "accent", size: "sm", icon: "download" })}
        </div>
      </div>
      ${card("Accès rapide", `<div class="ma-quick-grid">${quickAccess}</div>`)}
      <div class="ma-grid ma-grid-3">
        ${card("Dernières ventes", ventesTable, { icon: "cart", right: btn("Voir tout →", "goto-tab", { variant: "link", data: { tab: "caisse" } }) })}
        ${card("Production en cours", prodTable, { icon: "factory", right: btn("Voir tout →", "goto-tab", { variant: "link", data: { tab: "production" } }) })}
        ${card("Derniers lots", lotsTable, { icon: "branch", right: btn("Voir tout →", "goto-tab", { variant: "link", data: { tab: "tracabilite" } }) })}
      </div>
      <div class="ma-banner">
        <div>
          <p class="ma-banner-title">Votre atelier, votre créativité, notre solution</p>
          <p class="ma-banner-sub">Bougies artisanales — Authentiques et uniques</p>
        </div>
        <div class="ma-banner-checks">
          <span>${icon("check", 14)} Gestion complète de votre activité</span>
          <span>${icon("check", 14)} Traçabilité et lots</span>
          <span>${icon("check", 14)} Sauvegarde sécurisée</span>
        </div>
      </div>
    </div>`;
}
/* ============================================================ */
/* Délégation d'événements — posée une seule fois sur #app.       */
/* ============================================================ */
const ACTIONS = {
  "set-tab": (el) => setTab(el.dataset.tab),
  "goto-tab": (el) => { setTab(el.dataset.tab); },
  "goto-sauvegarde": () => setTab("sauvegarde"),
  "open-nav": () => setUI("app", { navOpen: true }),
  "close-nav": () => setUI("app", { navOpen: false }),
  "toggle-notifs": () => setUI("topbar", { showNotifs: !ui("topbar").showNotifs }),
  "close-sheet": () => setUI("app", { sheetBatch: null }),
  "close-receipt": () => setUI("caisse", { receiptOrder: null }),
  "close-history": () => setUI("matieres", { historyMaterialId: null }),
  "print": () => window.print(),
  "connect-drive": () => connectDriveFlow(),
  "disconnect-drive": () => disconnectDriveFlow(),
};

function initEvents() {
  const app = document.getElementById("app");
  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const handler = ACTIONS[el.dataset.action];
    if (handler) handler(el, e);
  });
  app.addEventListener("input", (e) => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.dataset.bind) {
      setBindValue(el.dataset.bind, el.value);
      renderPreservingFocus();
    } else if (el.dataset.dbInput) {
      const handler = INPUT_ACTIONS[el.dataset.dbInput];
      if (handler) { handler(el); renderPreservingFocus(); }
    }
  });
  app.addEventListener("change", (e) => {
    const el = e.target;
    if (!el.dataset) return;
    if (el.dataset.bind) {
      setBindValue(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value);
      render();
      return;
    }
    if (el.dataset.action && ACTIONS[el.dataset.action]) {
      ACTIONS[el.dataset.action](el, e);
    }
  });
}

/* data-bind="view.a.b.c" -> ui(view).a.b.c = value (crée les objets manquants). */
function setBindValue(path, value) {
  const parts = path.split(".");
  const view = parts.shift();
  let target = ui(view);
  for (let i = 0; i < parts.length - 1; i++) {
    const key = parts[i];
    if (typeof target[key] !== "object" || target[key] === null) target[key] = {};
    target = target[key];
  }
  target[parts[parts.length - 1]] = value;
}

/* Ré-affiche en conservant le focus et la position du curseur —
   nécessaire car chaque rendu remplace le HTML en entier. */
function renderPreservingFocus() {
  const active = document.activeElement;
  const key = active && active.dataset ? (active.dataset.key || active.dataset.bind) : null;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (key) {
    const el = document.querySelector(`[data-key="${key}"]`) || document.querySelector(`[data-bind="${key}"]`);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

async function connectDriveFlow() {
  if (!window.__driveTokenClient) return;
  window.__driveTokenClient.callback = (resp) => {
    if (resp && resp.access_token) {
      cacheDriveToken(resp.access_token, resp.expires_in);
      driveSyncFlow(resp.access_token);
    } else {
      state.driveStatus = "error"; render();
    }
  };
  window.__driveTokenClient.requestAccessToken({ prompt: "consent" });
}
function disconnectDriveFlow() {
  clearCachedDriveToken();
  window.__driveFileId = null;
  window.__driveLastPayload = null;
  state.driveStatus = "disconnected";
  render();
}
async function driveSyncFlow(token, opts) {
  opts = opts || {};
  try {
    state.driveStatus = "connecting"; render();
    const file = await driveFindOrCreateFile(token);
    window.__driveFileId = file.id;
    const remote = await driveReadFile(token, file.id);
    if (remote) {
      window.__driveLastPayload = JSON.stringify(remote);
      state.db = withDefaults(remote);
    } else if (state.db) {
      driveWriteFile(token, file.id, state.db).catch(() => {});
      window.__driveLastPayload = JSON.stringify(state.db);
    }
    state.driveStatus = "connected";
    state.driveLastSync = new Date();
  } catch (e) {
    state.driveStatus = opts.silent ? "disconnected" : "error";
  }
  render();
}

/* Code 39 — réutilise CODE39/traceDigits du socle métier, rendu en SVG. */
function barcode39(value, height, widthPx) {
  const digits = (traceDigits(value) || "0");
  const seq = `*${digits}*`;
  const bars = [];
  let x = 0;
  const narrow = 2, wide = 5, gap = 2;
  [...seq].forEach((ch) => {
    const pattern = CODE39[ch] || CODE39["-"];
    [...pattern].forEach((el, i) => {
      const w = el === "W" ? wide : narrow;
      if (i % 2 === 0) bars.push(`<rect x="${x}" y="0" width="${w}" height="${height}" fill="#083247"/>`);
      x += w;
    });
    x += gap;
  });
  return `<svg viewBox="0 0 ${x} ${height}" style="width:${widthPx || 180}px;height:${height}px">${bars.join("")}</svg>`;
}

ACTIONS["launch-production"] = () => {
  const v = ui("production");
  const db = state.db;
  const recipeId = v.recipeId || (db.recipes[0] ? db.recipes[0].id : "");
  const recipe = db.recipes.find((r) => r.id === recipeId);
  const qty = v.qty !== undefined ? v.qty : 10;
  if (!recipe) { v.error = "Créez d'abord une recette dans l'onglet Recettes."; render(); return; }
  if (!isPositiveNumber(qty)) { v.error = "La quantité à produire doit être un nombre supérieur à 0."; render(); return; }
  const yieldFactor = recipe.yieldPct > 0 ? recipe.yieldPct / 100 : 1;
  const needs = recipe.items.map((it) => {
    const m = db.rawMaterials.find((mm) => mm.id === it.materialId);
    return { material: m, needed: (it.qty * Number(qty)) / yieldFactor };
  });
  const shortfalls = needs.filter((n) => n.material && n.needed > n.material.stockQuantity);
  if (shortfalls.length > 0) { v.error = "Stock insuffisant : " + shortfalls.map((s) => s.material.name).join(", "); render(); return; }
  v.error = "";
  const batchNumber = nextBatchNumber(recipe.name, db.batches);
  const temp = v.temp !== undefined ? v.temp : 25;
  const humidity = v.humidity !== undefined ? v.humidity : 65;
  const cureTime = v.cureTime !== undefined ? v.cureTime : "24h";
  setDb((prev) => {
    const rawMaterials = prev.rawMaterials.map((m) => {
      const need = needs.find((n) => n.material && n.material.id === m.id);
      return need ? { ...m, stockQuantity: m.stockQuantity - need.needed } : m;
    });
    let products = [...prev.products];
    let product = products.find((p) => p.recipeId === recipe.id);
    if (product) products = products.map((p) => (p.id === product.id ? { ...p, stockQuantity: p.stockQuantity + Number(qty) } : p));
    else { product = { id: uid(), sku: nextSku(products), recipeId: recipe.id, name: recipe.name, pricePublic: 0, alertThreshold: 5, stockQuantity: Number(qty) }; products.push(product); }
    const batch = { batchNumber, date: todayISO(), recipeId: recipe.id, productId: product.id, quantityProduced: Number(qty), quantityRemaining: Number(qty), ambientTemperature: Number(temp), ambientHumidity: Number(humidity), cureTime, status: "En Cure" };
    return { ...prev, rawMaterials, products, batches: [batch, ...prev.batches] };
  });
  logMovement("Production", `Lot ${batchNumber} lancé — ${qty} × ${recipe.name}`);
  render();
};
ACTIONS["advance-batch"] = (el) => {

};

ACTIONS["cart-add"] = (el) => {
  const v = ui("caisse"); if (!v.cart) v.cart = [];
  const pid = el.dataset.id;
  const available = totalAvailableStock(state.db, pid);
  if (available <= 0) return;
  const existing = v.cart.find((c) => c.productId === pid);
  if (existing) { if (existing.qty < available) existing.qty += 1; }
  else v.cart.push({ productId: pid, qty: 1 });
  render();
};
ACTIONS["cart-qty"] = (el) => {
  const v = ui("caisse");
  const pid = el.dataset.id, delta = Number(el.dataset.delta);
  const available = totalAvailableStock(state.db, pid);
  const line = v.cart.find((c) => c.productId === pid);
  if (line) line.qty = Math.max(1, Math.min(available, line.qty + delta));
  render();
};
ACTIONS["cart-remove"] = (el) => {
  const v = ui("caisse");
  v.cart = v.cart.filter((c) => c.productId !== el.dataset.id);
  render();
};

ACTIONS["submit-sale"] = () => {
  const v = ui("caisse");
  const db = state.db;
  if (!v.client || !v.client.trim()) { v.error = "Merci d'indiquer le nom du client."; render(); return; }
  if (!v.cart || v.cart.length === 0) { v.error = "Ajoutez au moins un article au panier."; render(); return; }
  const calc = v.cart.map((c) => ({ ...c, ...allocateBatches(db, c.productId, c.qty) }));
  const insufficient = calc.filter((c) => !c.fulfilled);
  if (insufficient.length > 0) {
    const names = insufficient.map((c) => db.products.find((p) => p.id === c.productId)?.name).join(", ");
    v.error = `Stock insuffisant pour : ${names}`; render(); return;
  }
  v.error = "";
  const destination = DESTINATIONS.find((d) => d.id === v.destinationId);
  const items = [];
  calc.forEach((c) => {
    const p = db.products.find((pp) => pp.id === c.productId);
    c.allocations.forEach((a) => items.push({ productId: c.productId, name: p ? p.name : "", batchNumber: a.batchNumber, qty: a.qty, unitPrice: p ? p.pricePublic : 0 }));
  });
  const order = { orderId: uid(), date: todayISO(), clientName: v.client.trim(), channel: v.channel, payment: v.payment, destinationId: v.destinationId, shippingCost: destination ? destination.cost : 0, items };
  const totalHT = v.cart.reduce((s, c) => { const p = db.products.find((pp) => pp.id === c.productId); return s + (p ? p.pricePublic * c.qty : 0); }, 0);
  setDb((prev) => ({
    ...prev,
    products: prev.products.map((p) => { const q = items.filter((it) => it.productId === p.id).reduce((s, it) => s + it.qty, 0); return q ? { ...p, stockQuantity: p.stockQuantity - q } : p; }),
    batches: prev.batches.map((b) => { const q = items.filter((it) => it.batchNumber === b.batchNumber).reduce((s, it) => s + it.qty, 0); return q ? { ...b, quantityRemaining: b.quantityRemaining - q } : b; }),
    sales: [order, ...prev.sales],
  }));
  logMovement("Vente", `Commande ${order.clientName} — ${fmtEUR(totalHT + (destination ? destination.cost : 0))}`);
  v.client = ""; v.cart = []; v.receiptOrder = order.orderId;
  render();
};

ACTIONS["mark-received"] = (el) => {
  const purchase = state.db.purchases.find((p) => p.id === el.dataset.id);
  if (!purchase || purchase.status === "Reçu") return;
  setDb((prev) => ({
    ...prev,
    rawMaterials: prev.rawMaterials.map((m) => {
      const line = purchase.items.find((it) => it.materialId === m.id);
      if (!line) return m;
      const updated = { ...m, stockQuantity: m.stockQuantity + line.qty };
      if (line.unitPrice > 0 && line.unitPrice !== m.purchasePrice) {
        updated.purchasePrice = line.unitPrice;
        updated.priceHistory = [...(m.priceHistory || [{ date: todayISO(), price: m.purchasePrice }]), { date: todayISO(), price: line.unitPrice }];
      }
      return updated;
    }),
    purchases: prev.purchases.map((p) => (p.id === el.dataset.id ? { ...p, status: "Reçu", receivedDate: todayISO() } : p)),
  }));
  logMovement("Achat", `Réception fournisseur ${purchase.supplierName} — lot de matières ajouté au stock`);
};

function makeDirectoryActions(view, dbKey, blank, extraOnRename) {
  ACTIONS["toggle-" + view + "-form"] = () => {
    const v = ui(view);
    if (v.showForm && !v.editingId) { v.showForm = false; }
    else { v.form = { ...blank }; v.editingId = null; v.showForm = true; v.error = ""; }
    render();
  };
  ACTIONS["cancel-" + view + "-form"] = () => setUI(view, { showForm: false, editingId: null, error: "" });
  ACTIONS["edit-" + view] = (el) => {
    const item = state.db[dbKey].find((x) => x.id === el.dataset.id);
    if (!item) return;
    const v = ui(view);
    v.form = { ...blank, ...item };
    v.editingId = item.id; v.showForm = true; v.error = "";
    render();
  };
  ACTIONS["delete-" + view] = (el) => setDb((prev) => ({ ...prev, [dbKey]: prev[dbKey].filter((x) => x.id !== el.dataset.id) }));
  ACTIONS["save-" + view] = () => {
    const v = ui(view);
    const form = v.form || { ...blank };
    const name = (form.name || "").trim();
    if (!name) { v.error = `Le nom ${view === "clients" ? "du client" : "du fournisseur"} est obligatoire.`; render(); return; }
    if (!isValidEmail(form.email)) { v.error = "L'adresse e-mail n'est pas valide."; render(); return; }
    if (state.db[dbKey].some((x) => x.id !== v.editingId && x.name.trim().toLowerCase() === name.toLowerCase())) { v.error = `Un ${view === "clients" ? "client" : "fournisseur"} porte déjà ce nom.`; render(); return; }
    v.error = "";
    const cleanForm = { ...form, name };
    if (v.editingId) {
      const previous = state.db[dbKey].find((x) => x.id === v.editingId);
      const renamed = previous && previous.name !== name;
      setDb((prev) => {
        const next = { ...prev, [dbKey]: prev[dbKey].map((x) => (x.id === v.editingId ? { ...x, ...cleanForm } : x)) };
        return renamed && extraOnRename ? extraOnRename(next, previous.name, name) : next;
      });
    } else {
      setDb((prev) => ({ ...prev, [dbKey]: [...prev[dbKey], { id: uid(), ...cleanForm }] }));
    }
    v.form = null; v.editingId = null; v.showForm = false;
    render();
  };
}
makeDirectoryActions("clients", "clients", { name: "", type: CHANNELS[0], email: "", phone: "", address: "", notes: "" }, (next, oldName, newName) => ({
  ...next, sales: next.sales.map((o) => (o.clientName === oldName ? { ...o, clientName: newName } : o)),
}));
makeDirectoryActions("fournisseurs", "suppliers", { name: "", email: "", phone: "", address: "", notes: "" }, (next, oldName, newName) => ({

  purchases: next.purchases.map((p) => (p.supplierName === oldName ? { ...p, supplierName: newName } : p)),
}));

function salesForBatch(db, batchNumber) {
  return db.sales.filter((o) => o.items.some((it) => it.batchNumber === batchNumber))
    .map((o) => ({ order: o, item: o.items.find((it) => it.batchNumber === batchNumber) }));
}

        <div style="padding-left:20px;display:flex;flex-direction:column;gap:3px">
          ${salesForBatch(db, selectedBatch).length === 0 ? `<p class="ma-sm ma-muted">Aucune vente sur ce lot.</p>` :
            salesForBatch(db, selectedBatch).map(({ order, item }) => `<div class="ma-sm ma-muted" style="display:flex;align-items:center;gap:6px">${icon("arrow", 12)}${esc(order.date)} · ${esc(order.clientName)} · ${item.qty} unité(s) · ${esc(order.channel)}</div>`).join("")}

  return `<div class="ma-stack"><div class="ma-pills">${pills}</div>${body}</div>`;

function renderTraceabilitySheet(batchNumber) {
  const db = state.db;
  const batch = db.batches.find((b) => b.batchNumber === batchNumber);
  if (!batch) return "";
  const product = db.products.find((p) => p.id === batch.productId);
  const recipe = db.recipes.find((r) => r.id === batch.recipeId);
  const hazard = recipe && db.fragranceHazards[recipe.fragrance];
  const w = db.workshop;
  const yieldFactor = recipe ? (recipe.yieldPct > 0 ? recipe.yieldPct : 100) / 100 : 1;
  const consumption = recipe ? recipe.items.map((it) => {
    const m = db.rawMaterials.find((mm) => mm.id === it.materialId);
    return { material: m, qty: (it.qty * batch.quantityProduced) / yieldFactor };
  }) : [];
  const sales = salesForBatch(db, batch.batchNumber);
  const sold = batch.quantityProduced - batch.quantityRemaining;

  const consumptionRows = consumption.map((c) => `<tr>
    <td class="py-15">${esc(c.material ? c.material.name : "—")}</td>
    <td class="py-15 ma-muted">${esc(c.material ? c.material.category : "")}</td>
    <td class="py-15 ma-muted">${esc(c.material ? c.material.supplier : "")}</td>
    <td class="py-15" style="text-align:right">${fmtNum(c.qty, 2)} ${esc(c.material ? c.material.unit : "")}</td>
  </tr>`).join("") || `<tr><td colspan="4" class="ma-muted py-15">Recette introuvable.</td></tr>`;

  const salesRows = sales.map(({ order, item }) => `<tr>

  const hazardHtml = hazard ? `<div class="ma-sheet-hazard">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">

      <p class="ma-sm" style="margin-top:4px">Contient : ${esc(hazard.allergens.map((a) => `${a.name} (${a.pct}%)`).join(", "))}</p>

  return `<div class="ma-modal-overlay" data-action="close-sheet">

      <div class="ma-sheet-toolbar">
        <p class="ma-sm ma-strong" style="margin:0">Aperçu — fiche de traçabilité (A4)</p>

        </div>
      </div>
    </div>
  </div>`;
}

ACTIONS["etq-qrmode"] = (el) => setUI("etiquettes", { qrMode: el.dataset.mode });
function qrCodeSvg(value, size) {
  try {
    const grid = window.MiniQR.encode(value || "", "M");
    const n = grid.length;
    const quiet = 4; // marge blanche obligatoire (norme QR) pour que les scanners accrochent le motif
    const total = n + quiet * 2;
    const cell = size / total;
    let rects = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (grid[r][c]) rects += `<rect x="${((c + quiet) * cell).toFixed(2)}" y="${((r + quiet) * cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`;
    return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="white"/><g fill="#083247">${rects}</g></svg>`;
  } catch (e) {
    return `<div style="width:${size}px;height:${size}px;background:var(--slate-100)"></div>`;
  }
}

/* Petit graphique en barres réutilisable (CSS pur, sans bibliothèque). */
function barsChartHtml(labels, values, height) {
  const max = Math.max(1, ...values);
  return `<div class="ma-bars" style="height:${height || 140}px">${labels.map((label, i) => {
    const v = values[i];
    const h = Math.round((v / max) * 100);
    return `<div class="ma-bar-col"><div class="ma-bar" style="height:${Math.max(h, 3)}%" title="${esc(label)} : ${fmtEUR(v)}"></div><span class="ma-bar-label">${esc(label)}</span></div>`;
  }).join("")}</div>`;
}

function renderRapports(db) {
  const byMonth = {}; const byProduct = {};
  db.sales.forEach((o) => {
    const key = o.date.slice(0, 7);
    o.items.forEach((it) => {
      const total = it.qty * it.unitPrice;
      byMonth[key] = (byMonth[key] || 0) + total;
      if (!byProduct[it.productId]) byProduct[it.productId] = { name: it.name, qty: 0, ca: 0 };
      byProduct[it.productId].qty += it.qty;
      byProduct[it.productId].ca += total;
    });
  });
  const months = [];
  const d = new Date();
  for (let i = 11; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    months.push({ key: `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`, label: dt.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" }) });
  }
  const topProduits = Object.values(byProduct).sort((a, b) => b.ca - a.ca);
  const margeProduits = db.products.map((p) => {
    const recipe = db.recipes.find((r) => r.id === p.recipeId);
    const cost = recipe ? recipeUnitCost(recipe, db.rawMaterials) : 0;
    const marge = p.pricePublic - cost;
    return { name: p.name, prix: p.pricePublic, cout: cost, marge, margePct: p.pricePublic > 0 ? (marge / p.pricePublic) * 100 : 0 };
  });
  const valeurStockMatieres = db.rawMaterials.reduce((s, m) => s + m.stockQuantity * unitCostGuyane(m), 0);
  const valeurStockProduitsCout = db.products.reduce((s, p) => { const r = db.recipes.find((rr) => rr.id === p.recipeId); return s + p.stockQuantity * (r ? recipeUnitCost(r, db.rawMaterials) : 0); }, 0);
  const valeurStockProduitsPublic = db.products.reduce((s, p) => s + p.stockQuantity * p.pricePublic, 0);
  const now = todayISO().slice(0, 7);
  const achatsMois = db.purchases.filter((p) => p.date.slice(0, 7) === now).reduce((s, p) => s + p.items.reduce((ss, it) => ss + it.qty * it.unitPrice, 0), 0);
  const margeMoyenne = margeProduits.length ? `${fmtNum(margeProduits.reduce((s, r) => s + r.margePct, 0) / margeProduits.length, 0)}%` : "—";

  const topRows = topProduits.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.qty}</td><td class="ma-strong">${fmtEUR(r.ca)}</td></tr>`).join("") || `<tr><td colspan="3" style="text-align:center;padding:16px" class="ma-muted">Aucune vente enregistrée.</td></tr>`;
  const margeRows = margeProduits.map((r) => `<tr><td>${esc(r.name)}</td><td>${fmtEUR(r.prix)}</td><td class="ma-muted">${fmtEUR(r.cout)}</td><td style="color:${r.marge >= 0 ? "var(--sage)" : "var(--brick)"}" class="ma-strong">${fmtEUR(r.marge)} (${fmtNum(r.margePct, 0)}%)</td></tr>`).join("") || `<tr><td colspan="4" style="text-align:center;padding:16px" class="ma-muted">Aucun produit référencé pour le moment.</td></tr>`;

  const kpi = (label, value, hint, tone) => `<div class="ma-kpi ma-kpi-${tone || "neutral"}"><p class="ma-kpi-label">${esc(label)}</p><p class="ma-kpi-value" style="font-size:19px">${value}</p>${hint ? `<p class="ma-kpi-hint">${esc(hint)}</p>` : ""}</div>`;

  return `<div class="ma-stack">
    <div class="ma-grid" style="grid-template-columns:repeat(4,1fr)">
      ${kpi("Valeur stock matières", fmtEUR(valeurStockMatieres), "au coût rendu")}
      ${kpi("Valeur stock produits", fmtEUR(valeurStockProduitsPublic), `coût : ${fmtEUR(valeurStockProduitsCout)}`)}
      ${kpi("Achats ce mois-ci", fmtEUR(achatsMois))}
      ${kpi("Marge moyenne", margeMoyenne, null, "ok")}
    </div>
    ${card("Chiffre d'affaires — 12 derniers mois", barsChartHtml(months.map((m) => m.label), months.map((m) => byMonth[m.key] || 0), 150))}
    ${card("Top produits", `<div class="ma-table-wrap"><table><thead><tr><th>Produit</th><th>Quantité vendue</th><th>Chiffre d'affaires</th></tr></thead><tbody>${topRows}</tbody></table></div>`, { icon: "trending", right: btn("CSV", "export-top", { variant: "ghost", size: "sm", icon: "download" }) })}
    ${card("Marges par produit", `<div class="ma-table-wrap"><table><thead><tr><th>Produit</th><th>Prix public</th><th>Coût de revient</th><th>Marge</th></tr></thead><tbody>${margeRows}</tbody></table></div>`, { right: btn("CSV", "export-marges", { variant: "ghost", size: "sm", icon: "download" }) })}
  </div>`;
}

  if (!file) return;
  const slot = el.dataset.slot;
  if (file.size > 2 * 1024 * 1024) { ui("atelier")["pictoError_" + slot] = "Fichier trop volumineux (2 Mo max)."; render(); return; }
  const reader = new FileReader();
  reader.onload = () => {
    ui("atelier")["pictoError_" + slot] = "";
    setDb((prev) => ({ ...prev, pictograms: { ...(prev.pictograms || {}), [slot]: { url: reader.result } } }));
  };
  reader.onerror = () => { ui("atelier")["pictoError_" + slot] = "Échec de l'import."; render(); };
  reader.readAsDataURL(file);
};
ACTIONS["remove-picto"] = (el) => setDb((prev) => ({ ...prev, pictograms: { ...(prev.pictograms || {}), [el.dataset.slot]: null } }));
ACTIONS["save-atelier"] = () => {
  const v = ui("atelier");
  const form = v.form || state.db.workshop;
  if (!form.name || !form.name.trim()) { v.error = "Le nom commercial est obligatoire."; v.saved = false; render(); return; }
  if (!isValidEmail(form.email)) { v.error = "L'adresse e-mail n'est pas valide."; v.saved = false; render(); return; }
  if (!isValidSiret(form.siret)) { v.error = "Le SIRET doit comporter exactement 14 chiffres (laissez vide si non applicable)."; v.saved = false; render(); return; }
  v.error = "";
  setDb((prev) => ({ ...prev, workshop: { ...prev.workshop, ...form, name: form.name.trim() } }));
  v.saved = true; render();
  setTimeout(() => { v.saved = false; render(); }, 2000);
};

    if (state.driveStatus === "connected") {
      return `<p class="ma-sm" style="color:var(--sage);display:flex;align-items:center;gap:6px">${icon("check", 14)}Connecté — synchronisation automatique active.</p>
        ${state.driveLastSync ? `<p class="ma-sm ma-muted" style="margin-top:4px">Dernière synchro : ${esc(new Date(state.driveLastSync).toLocaleTimeString("fr-FR"))}</p>` : ""}
        <div style="margin-top:10px">${btn("Déconnecter", "disconnect-drive", { variant: "ghost", size: "sm" })}</div>`;
    }
    if (state.driveStatus === "connecting") return `<p class="ma-sm ma-muted">Connexion en cours…</p>`;
    return `<p class="ma-sm ma-muted" style="margin-bottom:10px">${state.driveStatus === "error" ? "La connexion a échoué. " : ""}Connectez votre Google Drive pour synchroniser automatiquement vos données entre vos appareils.</p>${btn("Connecter Google Drive", "connect-drive", { icon: "cloud" })}`;

  return `<div class="ma-stack" style="max-width:560px">
    ${driveCard}
    ${card("Export comptable", `<p class="ma-sm ma-muted" style="margin-bottom:10px">Export CSV du détail des ventes (compatible Excel / comptabilité).</p>${btn("Exporter les ventes (CSV)", "export-sales-csv", { icon: "download" })}`, { icon: "download" })}
    ${card("Sauvegarde complète (JSON)", `
      <p class="ma-sm ma-muted" style="margin-bottom:10px">${state.driveStatus === "connected" ? "Vos données sont déjà synchronisées via Google Drive. Cet export reste utile pour un archivage ponctuel." : "Toutes les données de l'atelier sont stockées localement sur cet appareil. Exportez une sauvegarde pour la transférer ou la conserver."}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${btn("Exporter (JSON)", "export-json", { variant: "ghost", icon: "download" })}
        <label class="ma-upload-label" style="padding:9px 14px">${icon("upload", 15)}Importer<input type="file" accept="application/json" style="display:none" data-action="import-json" /></label>
      </div>
    `, { icon: "save" })}
    ${card("Réinitialiser", v.confirmReset ? `<div style="display:flex;gap:8px">${btn("Confirmer", "confirm-reset", { variant: "danger", icon: "rotate" })}${btn("Annuler", "cancel-reset", { variant: "ghost" })}</div>` : `<p class="ma-sm ma-muted" style="margin-bottom:10px">Recharge les données de démonstration et efface les modifications en cours.</p>${btn("Réinitialiser les données", "ask-reset", { variant: "ghost", icon: "rotate" })}`)}
    ${card("Historique des mouvements", `<div style="max-height:260px;overflow-y:auto">${db.movements.map((m) => `<div class="ma-row-line"><span class="ma-muted">${esc(m.detail)}</span><span class="ma-muted ma-sm" style="white-space:nowrap">${esc(m.date)}</span></div>`).join("") || `<p class="ma-muted">Aucun mouvement.</p>`}</div>`)}
  </div>`;
}
ACTIONS["export-sales-csv"] = () => {
  const rows = [["Date", "Client", "Canal", "Paiement", "Produit", "N° de lot", "Quantité", "Prix unitaire", "Total ligne", "Frais de port"]];
  state.db.sales.forEach((o) => o.items.forEach((it) => rows.push([o.date, o.clientName, o.channel, o.payment, it.name, it.batchNumber, it.qty, it.unitPrice.toFixed(2), (it.qty * it.unitPrice).toFixed(2), o.shippingCost.toFixed(2)])));
  downloadFile(`malyah-art-ventes-${todayISO()}.csv`, "\uFEFF" + csvEscape(rows), "text/csv;charset=utf-8");
};
ACTIONS["export-json"] = () => downloadFile(`malyah-art-sauvegarde-${todayISO()}.json`, JSON.stringify(state.db, null, 2), "application/json");
ACTIONS["import-json"] = (el) => {
  const file = el.files && el.files[0];
  el.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { setDb(withDefaults(JSON.parse(reader.result))); } catch (err) { alert("Fichier invalide."); } };
  reader.readAsText(file);
};
ACTIONS["ask-reset"] = () => setUI("sauvegarde", { confirmReset: true });
ACTIONS["cancel-reset"] = () => setUI("sauvegarde", { confirmReset: false });
ACTIONS["confirm-reset"] = () => { setDb(seedData()); setUI("sauvegarde", { confirmReset: false }); };

/* ============================================================ */
function renderRecettes(db) {
  const v = ui("recettes");
  const items = v.items || [{ materialId: db.rawMaterials[0] ? db.rawMaterials[0].id : "", qty: "" }];
  const f = v.form || { name: "", texture: "Solide", netWeight: "", yieldPct: 100, fragrance: "" };

  const formHtml = !v.showForm ? "" : card(null, `
    ${db.rawMaterials.length === 0 ? `<p class="ma-sm" style="color:var(--brick);margin-bottom:10px">Aucune matière première enregistrée — créez-en d'abord dans l'onglet Matières premières pour pouvoir composer une recette.</p>` : ""}
    <div class="ma-grid ma-grid-2" style="grid-template-columns:repeat(4,1fr);margin-bottom:10px">
      ${field("Nom du produit", `<input type="text" value="${esc(f.name)}" data-bind="recettes.form.name" />`)}
      ${field("Texture", `<select data-bind="recettes.form.texture">${TEXTURES.map((t) => `<option ${f.texture === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`)}
      ${field("Poids net (g)", `<input type="number" value="${esc(f.netWeight)}" data-bind="recettes.form.netWeight" />`)}
      ${field("Rendement (%)", `<input type="number" value="${esc(f.yieldPct)}" data-bind="recettes.form.yieldPct" />`)}
    </div>
    ${field("Parfum (fiche de sécurité)", `<input type="text" placeholder="ex: Parfum Caramel" value="${esc(f.fragrance)}" data-bind="recettes.form.fragrance" style="max-width:320px" />`)}
    <p class="ma-sm ma-muted" style="margin:12px 0 8px">Composition (dosage pour 1 unité, à rendement 100%) :</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${items.map((it, i) => `
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select style="flex:1;min-width:160px" data-action="recipe-item-material" data-index="${i}">${db.rawMaterials.map((m) => `<option value="${m.id}" ${it.materialId === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
          <input type="number" placeholder="Quantité" style="width:110px" value="${esc(it.qty)}" data-bind="recettes.items.${i}.qty" />
          <button class="ma-icon-btn" data-action="recipe-item-remove" data-index="${i}">${icon("trash", 14)}</button>
        </div>`).join("")}
    </div>
    <div style="margin-top:8px">${btn("Ajouter un ingrédient", "recipe-item-add", { variant: "ghost", size: "sm", icon: "plus" })}</div>
    ${v.error ? `<p class="ma-error">${icon("alert", 13)}${esc(v.error)}</p>` : ""}
    <div style="display:flex;gap:8px;margin-top:14px">${btn("Enregistrer la recette", "save-recipe")}${btn("Annuler", "cancel-recipe-form", { variant: "ghost" })}</div>
  `);

  const cards = db.recipes.length === 0 && !v.showForm ? `<p class="ma-muted" style="grid-column:1/-1">Aucune recette enregistrée pour le moment.</p>` :
    db.recipes.map((r) => {
      const ingredients = r.items.map((it) => {
        const m = db.rawMaterials.find((mm) => mm.id === it.materialId);
        return `<li>${esc(m ? m.name : "?")} — ${it.qty}${esc(m ? m.unit : "")}</li>`;
      }).join("");
      return card(r.name, `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          ${badge(esc(r.textureType))}${badge(`${r.netWeight}g`, "accent")}${badge(`Rendement ${r.yieldPct || 100}%`)}${r.fragrance ? badge(esc(r.fragrance)) : ""}
        </div>
        <ul class="ma-ingredients">${ingredients}</ul>

      `);
    }).join("");

  return `<div class="ma-stack">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h3 class="ma-h2" style="font-size:20px">Fiches de formulation</h3>
      ${btn(v.showForm ? "Fermer" : "Nouvelle recette", "toggle-recipe-form", { icon: v.showForm ? "x" : "plus" })}
